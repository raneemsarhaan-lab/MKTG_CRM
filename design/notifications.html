<title>Momentum Notifications</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: a bench (screen picker, language) around one live mock of the app.
   The app is light-only, so the mock commits to its light look; the bench
   follows the viewer's theme. Colours are Momentum's tokens plus the new
   notification ones: red badge, unread tint, blue dot. */
:root {
  --ink: #14131A; --text: #1F2430; --text2: #4A5061; --muted: #6B7280; --faint: #9096A3;
  --line: #ECECF1; --input: #E9E9EF; --surface: #F3F3F7; --panel: #FFFFFF;
  --lime: #C9F24E; --purple: #7C3AED; --purple-soft: #F0EBFE; --tick: #8B5CF6;
  --nt-red: #E5484D; --nt-tint: #F4F0FF; --nt-tint-hover: #ECE5FF; --nt-blue: #2563EB; --urgent: #F59E0B;
  --late: #C81E3A; --late-soft: #FDE7EA; --ok: #15803D;
  --f-head: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --f-ar: 'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif;
  --b-bg: #EEEEF3; --b-fg: #1F2430; --b-muted: #5B6170; --b-card: #FFFFFF; --b-line: #DCDCE5; --b-on: #14133C; --b-on-fg: #FFFFFF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --b-bg: #15141B; --b-fg: #E8E8EE; --b-muted: #A3A6B3; --b-card: #1F1E27; --b-line: #33323E; --b-on: #D6F551; --b-on-fg: #14131A; color-scheme: dark } }
:root[data-theme="dark"] {
  --b-bg: #15141B; --b-fg: #E8E8EE; --b-muted: #A3A6B3; --b-card: #1F1E27; --b-line: #33323E; --b-on: #D6F551; --b-on-fg: #14131A; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--b-bg); color: var(--b-fg); font-family: var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--purple); outline-offset: 2px; }

.bench { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }
.bench h1 { font: 800 22px/1.2 var(--f-head); margin: 0; }
.lede { color: var(--b-muted); margin: 4px 0 0; max-width: 78ch; line-height: 1.5; font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--b-card); border: 1px solid var(--b-line); border-radius: 14px; padding: 10px 14px; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--b-muted); font-weight: 600; flex-wrap: wrap; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--b-line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--b-fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--b-on); color: var(--b-on-fg); }
.note { font-size: 13px; color: var(--b-muted); line-height: 1.5; max-width: 90ch; }

/* app frame */
.frame { position: relative; background: var(--panel); color: var(--text); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,19,26,.06), 0 12px 40px rgba(20,19,26,.10); min-height: 620px; font-family: var(--f-body); }
.frame[dir="rtl"] { font-family: var(--f-ar); }
.frame.phone { max-width: 390px; margin: 0 auto; border: 8px solid #14131A; border-radius: 30px; min-height: 720px; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 6px; flex: none; }
.tab { font: 700 15px var(--f-head); color: var(--ink); padding: 9px 16px; border-radius: 999px; }
[dir="rtl"] .tab, [dir="rtl"] .title, [dir="rtl"] h2 { font-family: var(--f-ar); }
.tab.on { background: var(--purple-soft); color: var(--purple); }
.search { flex: 1 1 220px; max-width: 420px; margin-inline: auto; height: 42px; border: 1px solid var(--input); border-radius: 999px; display: flex; align-items: center; padding-inline: 16px; color: #A2A7B4; font-size: 14px; min-width: 0; overflow: hidden; white-space: nowrap; }
.hbtn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; min-width: 44px; justify-content: center; padding: 0 10px; border: 0; background: none; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--ink); flex: none; }
.hbtn:hover, .hbtn[aria-expanded="true"] { background: var(--surface); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font: 700 11.5px/20px var(--f-body); text-align: center; color: #fff; background: var(--purple); }
.badge.red { background: var(--nt-red); position: absolute; top: 1px; inset-inline-end: -1px; box-shadow: 0 0 0 2px var(--panel); }
.badge.urgent { background: var(--urgent); color: var(--ink); }
.vr { width: 1px; height: 26px; background: var(--line); flex: none; }
.avatar { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid #A855F7; background: #C2410C; color: #fff; font: 700 13px var(--f-body); display: grid; place-items: center; flex: none; }
.titlerow { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 8px; }
.title { margin: 0; font: 800 32px/1 var(--f-head); color: var(--ink); }
.cta { height: 44px; padding: 0 18px; border-radius: 999px; background: var(--lime); font: 700 15px var(--f-head); color: var(--ink); display: inline-flex; align-items: center; }
.cols { display: flex; gap: 12px; padding: 12px 22px 22px; overflow: hidden; }
.col { flex: 0 0 210px; height: 320px; border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 12px; padding: 10px; font: 700 12px var(--f-head); color: var(--ink); background: #FDFDFE; }
.ghost { margin-top: 10px; height: 64px; border-radius: 10px; background: var(--surface); }

/* panel */
.panel { position: absolute; top: 64px; inset-inline-end: 14px; width: min(410px, calc(100% - 28px)); max-height: calc(100% - 78px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 50px rgba(20,19,60,.20); z-index: 5; }
.phone .panel { position: absolute; inset: 0; top: 0; width: 100%; max-height: none; border-radius: 0; border: 0; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 4px; }
.phead h2 { margin: 0; font: 800 19px var(--f-head); color: var(--ink); }
.link { border: 0; background: none; color: var(--nt-blue); font-weight: 600; font-size: 13px; cursor: pointer; padding: 6px; }
.ptabs { display: flex; gap: 6px; padding: 6px 16px 8px; }
.ptab { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; color: var(--text2); cursor: pointer; }
.ptab[aria-selected="true"] { background: var(--purple-soft); color: var(--purple); }
.offer { margin: 4px 12px 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface); display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; line-height: 1.4; }
.offer b { display: block; color: var(--ink); }
.offer .go { border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
.offer .x { grid-column: 3; }
.sect { padding: 8px 16px 2px; font: 700 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .sect { letter-spacing: 0; }
.row { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) 12px; gap: 10px; align-items: start; padding: 10px 10px; margin: 0 6px; border-radius: 10px; cursor: pointer; }
.row:hover { background: var(--surface); }
.row.unread { background: var(--nt-tint); }
.row.unread:hover { background: var(--nt-tint-hover); }
.ava { position: relative; width: 42px; height: 42px; }
.ava i { position: absolute; width: 34px; height: 34px; border-radius: 50%; color: #fff; font: 700 12px/34px var(--f-body); text-align: center; font-style: normal; border: 2px solid var(--panel); }
.ava i:nth-child(1) { top: 0; inset-inline-start: 0; }
.ava i:nth-child(2) { top: 8px; inset-inline-start: 8px; }
.ava.one i { width: 42px; height: 42px; line-height: 42px; }
.kind { position: absolute; bottom: -3px; inset-inline-end: -3px; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 2px solid var(--panel); }
.kind svg { width: 11px; height: 11px; }
.msg { font-size: 13.5px; line-height: 1.45; color: var(--text); min-width: 0; }
.msg b { font-weight: 700; color: var(--ink); }
.msg q { display: block; color: var(--muted); font-size: 12.5px; quotes: none; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.msg time { display: block; font-size: 12px; color: var(--nt-blue); font-weight: 600; margin-top: 3px; }
.row:not(.unread) .msg time { color: var(--muted); font-weight: 500; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--nt-blue); margin-top: 16px; }
.more { position: absolute; top: 10px; inset-inline-end: 26px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: none; place-items: center; font-weight: 800; color: var(--text2); cursor: pointer; }
.row:hover .more, .row.menu-open .more { display: grid; }
.menu { position: absolute; top: 42px; inset-inline-end: 14px; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(20,19,26,.16); padding: 6px; width: 250px; }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; text-align: start; cursor: pointer; }
.menu button:hover { background: var(--surface); }
.pfoot { display: flex; justify-content: space-between; padding: 8px 14px 12px; border-top: 1px solid var(--line); margin-top: 6px; }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.empty b { display: block; font: 700 15px var(--f-head); color: var(--ink); margin-bottom: 4px; }
.toast { position: absolute; bottom: 18px; inset-inline-end: 18px; width: min(350px, calc(100% - 36px)); background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr) 20px; gap: 10px; align-items: center; font-size: 13px; line-height: 1.4; box-shadow: 0 12px 30px rgba(20,19,26,.3); z-index: 6; }
.toast i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; }
.toast small { opacity: .72; display: block; }
.toast .bar { position: absolute; inset-inline-start: 14px; bottom: 6px; height: 2px; width: 40%; background: rgba(255,255,255,.4); border-radius: 2px; }
.phone .toast { bottom: 76px; }

/* task panel */
.task { position: absolute; inset-block: 0; inset-inline-end: 0; width: min(560px, 100%); background: var(--panel); border-inline-start: 1px solid var(--line); box-shadow: -18px 0 40px rgba(20,19,26,.12); overflow: auto; z-index: 4; }
.thead { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.thead h2 { margin: 0; flex: 1; font: 800 18px var(--f-head); color: var(--ink); min-width: 0; }
.follow { border: 1px solid var(--input); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.follow[aria-pressed="true"] { background: var(--purple-soft); border-color: transparent; color: var(--purple); }
.tbody { padding: 14px 18px; display: grid; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12.5px; }
.chip { background: var(--surface); border-radius: 999px; padding: 4px 10px; font-weight: 600; }
.cmt { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; font-size: 13.5px; line-height: 1.45; }
.cmt i { width: 32px; height: 32px; border-radius: 50%; color: #fff; font: 700 12px/32px var(--f-body); text-align: center; font-style: normal; }
.cmt b { color: var(--ink); }
.cmt time { color: var(--muted); font-size: 12px; margin-inline-start: 6px; }
.cmt .acts { display: flex; gap: 12px; margin-top: 4px; }
.cmt .acts button { border: 0; background: none; padding: 0; color: var(--text2); font-weight: 700; font-size: 12.5px; cursor: pointer; }
.thread { margin-inline-start: 42px; padding-inline-start: 12px; border-inline-start: 2px solid var(--line); display: grid; gap: 10px; }
.flash { animation: flash 1.6s ease 1; border-radius: 10px; }
@keyframes flash { 0%, 100% { background: transparent; } 25% { background: #FFF7D6; box-shadow: 0 0 0 6px #FFF7D6; } }
.mention { color: var(--purple); font-weight: 700; }
.composer { border: 1px solid var(--input); border-radius: 12px; padding: 10px 12px; color: var(--muted); font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
.composer .send { background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 12.5px; }
.files { display: flex; gap: 8px; flex-wrap: wrap; }
.file { width: 92px; height: 64px; border-radius: 10px; background: linear-gradient(135deg, #E9E3FF, #F3F3F7); border: 1px solid var(--line); }
.file.new { box-shadow: 0 0 0 2px var(--nt-blue); }

/* settings + history page */
.page { padding: 18px 22px 26px; display: grid; gap: 16px; }
.page h2 { margin: 0; font: 800 24px var(--f-head); color: var(--ink); }
.card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 460px; }
th, td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: start; }
th { font: 700 12px var(--f-body); color: var(--text2); background: var(--surface); }
td.c, th.c { text-align: center; }
td small { display: block; color: var(--muted); font-size: 12px; }
.sw { width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; display: inline-block; border: 0; cursor: pointer; vertical-align: middle; }
.sw::after { content: ""; position: absolute; top: 2.5px; inset-inline-start: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: inset-inline-start .15s; }
.sw[aria-checked="true"] { background: var(--purple); }
.sw[aria-checked="true"]::after { inset-inline-start: 17.5px; }
.sw:disabled { opacity: .35; cursor: not-allowed; }
.opts { display: grid; gap: 12px; padding: 14px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13.5px; flex-wrap: wrap; }
.opt b { display: block; color: var(--ink); }
.opt small { color: var(--muted); }
.pairs { display: inline-flex; border: 1px solid var(--input); border-radius: 999px; padding: 3px; }
.pairs button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
.pairs button[aria-pressed="true"] { background: var(--purple-soft); color: var(--purple); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { border: 1px solid var(--input); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.ios { margin: 8px 12px; border-radius: 14px; border: 1px solid var(--line); padding: 14px; font-size: 13.5px; line-height: 1.5; }
.ios ol { margin: 8px 0 0; padding-inline-start: 20px; }
.tabbar { position: absolute; inset: auto 0 0; height: 62px; border-top: 1px solid var(--line); background: var(--panel); display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: var(--muted); font-weight: 600; z-index: 4; }
.unavail { position: absolute; inset: 0; background: rgba(20,19,26,.35); display: grid; place-items: center; z-index: 7; }
.unavail div { background: var(--panel); border-radius: 16px; padding: 22px; width: min(360px, 90%); text-align: center; display: grid; gap: 10px; }
.unavail b { font: 800 17px var(--f-head); color: var(--ink); }
.unavail button { justify-self: center; border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 700; cursor: pointer; }

@media (max-width: 760px) {
  .search { display: none; }
  .hbtn .word { display: none; }
  .top { padding: 10px 12px; gap: 4px; }
  .tab { padding: 8px 11px; font-size: 14px; }
  .titlerow { padding: 14px 12px 4px; } .title { font-size: 26px; }
  .page { padding: 14px 12px; }
}
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>

<div class="bench">
  <div>
    <h1>Notifications: the full design</h1>
    <p class="lede">Spec 012, option A: the bell sits beside the Inbox. Pick a screen and a language. Everything in the mock responds to clicks: rows, tabs, ⋯ menus, switches and Follow. Task names and people are examples.</p>

</div>

  const frame = document.getElementById('frame')
  function render() {
    document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[seg.dataset.ctl] === b.dataset.v))))
    frame.className = 'frame' + (S.device !== 'desktop' ? ' phone' : '')
    frame.dir = S.lang === 'ar' ? 'rtl' : 'ltr'
    frame.lang = S.lang
    let h = ''
    if (S.screen === 'settings') h = settings()
    else if (S.screen === 'history') h = history()
    else {
      h = header()
      if (S.screen === 'panel') h += panel()
      if (S.screen === 'toast') h += `<div class="toast" role="status"><i style="background:${P.Salma}">${nm('Salma')[0]}</i><span>${L().rows.toast}<small>“Can we try it with the team photo?” · ${L().toastMore}</small></span><span style="opacity:.7">✕</span><span class="bar"></span></div>`

  document.querySelector('.controls').addEventListener('click', e => {

    S[b.closest('.seg').dataset.ctl] = b.dataset.v; S.menu = null
    if (b.closest('.seg').dataset.ctl === 'device' && b.dataset.v === 'iphone') S.screen = 'panel'
    render()
  })
  frame.addEventListener('click', e => {
    const t = e.target
    const m = t.closest('[data-menu]'); if (m) { e.stopPropagation(); S.menu = S.menu === m.dataset.menu ? null : m.dataset.menu; render(); return }
    const tg = t.closest('[data-toggle]'); if (tg) { const r = ROWS().find(x => x.id === tg.dataset.toggle); S.read[r.id] = isUnread(r); S.menu = null; render(); return }
    if (t.closest('[data-close]')) { S.menu = null; render(); return }
    const r = t.closest('[data-row]'); if (r) { const row = ROWS().find(x => x.id === r.dataset.row); S.read[row.id] = true; S.screen = row.k === 'attachment' ? 'files' : row.k === 'comment' || row.k === 'mention' || row.k === 'reply' ? 'task' : 'panel'; render(); return }
    const g = t.closest('[data-go]'); if (g) { S.screen = g.dataset.go === 'board' ? 'toast' : g.dataset.go; render(); return }
    const tab = t.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); return }
    if (t.closest('[data-markall]')) { ROWS().forEach(x => { S.read[x.id] = true }); render(); return }
    if (t.closest('[data-offer]')) { S.offer = false; render(); return }
    if (t.closest('[data-follow]')) { S.follow = !S.follow; render(); return }
    const sw = t.closest('[data-sw]'); if (sw) { const [i, ch] = sw.dataset.sw.split(':').map(Number); S.set[i][ch] = S.set[i][ch] ? 0 : 1; if (ch === 0 && !S.set[i][0]) S.set[i] = [0, 0, 0]; render(); return }
    const em = t.closest('[data-email]'); if (em) { S.emailMode = em.dataset.email; render(); return }
    if (t.closest('[data-dnd]')) { S.dnd = !S.dnd; render(); return }
    const hk = t.closest('[data-hk]'); if (hk) { const k = hk.dataset.hk; S.hkinds = S.hkinds.includes(k) ? S.hkinds.filter(x => x !== k) : [...S.hkinds, k]; render(); return }
    const hd = t.closest('[data-hd]'); if (hd) { S.hdate = +hd.dataset.hd; render(); return }
    if (S.menu) { S.menu = null; render() }
  })
  frame.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-row]')) { e.preventDefault(); e.target.click() } if (e.key === 'Escape' && S.menu) { S.menu = null; render() } })
  render()
})()
</script>
