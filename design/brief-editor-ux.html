<!doctype html>
<!--
  Momentum brief editor: design file for spec 005 (specs/005-brief-editor-ux).
  Constitution §IV source of truth for the editor's layout, colours (BRIEF_UI),
  interactions and copy, including Arabic. Committed as plain, readable HTML
  rather than the compressed bundle format of design/ui/*.html (plan.md §IV).
  Live preview: https://claude.ai/artifact/Kmwf5sJKJunFtvGMfwdSNR
  Open this file directly in a browser; it is self-contained apart from Google Fonts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Brief Editor Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: a guided tour rail beside a live task-panel mock. The editor uses Momentum's
   blue + lime BRIEF_UI palette (spec 005, R17). Deliberately light-only: it previews a light app. */
:root{
  color-scheme:light;
  --ink:#18233F; --label:#68738D; --faint:#929CB0; --line:#E9EDF4; --surface:#F8FAFD;
  --blue:#3563E9; --blue-light:#EEF3FF; --blue-active:#E5EDFF; --error:#F5334F; --error-bg:#FDECEF;
  --lime:#C8F24E; --rail:#17181A; --page:#F1F3F8; --panel:#FFFFFF; --muted:#8A8D91;
  --font-body:'Inter','Noto Sans Arabic',system-ui,sans-serif; --font-head:'Montserrat','Noto Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font:14px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{background:var(--rail);color:#F2F2EE;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
.top h1{margin:0;font:800 1.05rem var(--font-head);display:flex;align-items:center;gap:8px}
.top h1 i{width:14px;height:14px;border-radius:4px;background:var(--lime)}
.top p{margin:0;color:#ffffffa0;font-size:.8rem}
.controls{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:#ffffff14;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#ffffffa8;padding:4px 12px;border-radius:999px;font-weight:600;font-size:.76rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--rail)}
.switch{display:flex;align-items:center;gap:7px;font-size:.76rem;color:#ffffffc8;cursor:pointer;user-select:none}
.switch input{accent-color:var(--error);width:15px;height:15px;margin:0}

.layout{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.tour{display:grid;gap:6px;align-content:start}
.tour h2{margin:0 0 4px;font:700 .7rem var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
.step{display:grid;gap:3px;text-align:start;border:1px solid transparent;background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer}
.step:hover{border-color:var(--line)}
.step[aria-current="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.step b{font-weight:700;font-size:.86rem}
.step span{font-size:.75rem;color:var(--label)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.64rem;font-weight:700;color:var(--blue);background:var(--blue-light);border-radius:5px;padding:1px 5px;font-variant-numeric:tabular-nums}
.tip{background:var(--rail);color:#F2F2EE;border-radius:12px;padding:12px 14px;font-size:.8rem;line-height:1.55;margin-bottom:12px}
.tip b{color:var(--lime)}
.tip kbd{font:600 .72rem var(--font-body);background:#ffffff1c;border-radius:4px;padding:1px 5px}

.stage{min-width:0;display:grid;justify-items:center;align-content:start}
.frame{width:100%;max-width:820px;background:var(--panel);border-radius:20px;box-shadow:0 10px 40px rgba(24,35,63,.08);
  max-height:720px;overflow:auto;transition:max-width .25s}
.frame.phone{max-width:390px;border:10px solid var(--rail);border-radius:34px;max-height:740px}
.panel-head{padding:20px 24px 6px;display:grid;gap:4px}
.frame.phone .panel-head{padding:16px 14px 4px}
.crumb{font-size:.72rem;color:var(--label);font-weight:600}
.panel-head h3{margin:0;font:800 1.15rem/1.25 var(--font-head);text-wrap:balance}
.lbl{font:700 .66rem var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--label);padding:14px 24px 8px}
.frame.phone .lbl{padding-inline:14px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lbl .hint2{font:600 .7rem var(--font-body);letter-spacing:0;text-transform:none;color:var(--faint)}
.ed.viewing{box-shadow:0 0 0 1px transparent;cursor:text;transition:box-shadow .12s}
.ed.viewing:hover{box-shadow:0 0 0 1px var(--line),0 2px 12px rgba(24,35,63,.06)}
.ed.viewing .tb{display:none}
.ed.viewing .content{border-radius:18px}
.ed.viewing .content a{cursor:pointer}
.ed.viewing .content a:hover{text-decoration:underline}
.colhandle{position:absolute;z-index:18;width:5px;margin-inline-start:-1px;cursor:col-resize;touch-action:none;background:transparent}
.colhandle::after{content:"";position:absolute;inset:0 1px;border-radius:2px;background:var(--blue);opacity:.55}
.colhandle.on::after,.colhandle:hover::after{opacity:1}
.wlabel{position:absolute;z-index:19;background:var(--ink);color:#fff;font:700 .7rem var(--font-body);border-radius:6px;padding:3px 7px;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.content.resizing{cursor:col-resize;user-select:none}
.edwrap{position:relative;margin:0 24px 24px}
.frame.phone .edwrap{margin:0 10px 16px}

/* editor shell — note: no overflow:hidden, so the toolbar can stick (R13) */
.ed{border-radius:18px;background:var(--panel);box-shadow:0 2px 12px rgba(24,35,63,.06),0 0 0 1px var(--line)}
.ed.focus{box-shadow:0 0 0 2px rgba(53,99,233,.14),0 4px 20px rgba(24,35,63,.05)}
.tb{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-height:54px;padding:8px 12px;
  background:var(--surface);border-radius:18px 18px 0 0;border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:2px}
.grp+.grp{border-inline-start:1px solid var(--line);padding-inline-start:5px;margin-inline-start:4px}
.tbtn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;min-width:32px;padding:0 7px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;font-size:.8rem;font-weight:500}
.tbtn:hover,.tbtn[aria-pressed="true"],.tbtn[aria-expanded="true"]{background:var(--blue-active);color:var(--blue)}
.tbtn[aria-pressed="true"]{font-weight:700}
.tbtn:disabled{opacity:.35;cursor:default;background:transparent;color:var(--ink)}
.tbtn.chip{background:var(--panel);box-shadow:0 1px 2px rgba(24,35,63,.06);padding:0 10px}
.tbtn svg{width:15px;height:15px;flex:none}
.spacer{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--faint);padding:0 4px;white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.saving{color:var(--blue)} .status.saving .dot{background:var(--blue);animation:pulse 1s infinite}
.status.error{color:var(--error)} .status.error .dot{background:var(--error)}
.status .retry{border:0;background:var(--error);color:#fff;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:700;cursor:pointer}
@keyframes pulse{50%{opacity:.35}}
.frame.phone .tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:6px 8px;min-height:48px}
.frame.phone .tb::-webkit-scrollbar{display:none}
.frame.phone .status .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.frame.phone .status.error .txt{position:static;width:auto;height:auto;clip:auto}
.frame.phone .phone-hide{display:none}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;font-size:.8rem}
.bar.prompt{background:var(--blue-light)}
.bar.prompt label{font-weight:700;color:var(--blue)}
.bar.prompt input{flex:1;min-width:150px;height:30px;border:1px solid transparent;border-radius:8px;padding:0 10px;font:inherit;background:var(--panel);color:var(--ink)}
.bar.prompt input[aria-invalid="true"]{border-color:var(--error)}
.bar .err{width:100%;color:var(--error);font-size:.74rem;font-weight:600}
.bar.confirm{background:var(--error-bg);color:var(--ink)}
.bar.confirm b{color:var(--error)}
.pbtn{height:30px;border:0;border-radius:8px;padding:0 12px;font-weight:700;font-size:.78rem;cursor:pointer;background:var(--blue);color:#fff}
.pbtn.ghost{background:transparent;color:var(--ink)}
.pbtn.danger{background:var(--error)}
.pbtn:disabled{opacity:.45;cursor:default}

.content{padding:22px 26px 30px;min-height:220px;outline:none;font-size:.9rem;line-height:1.6;border-radius:0 0 18px 18px}
.frame.phone .content{padding:16px 14px 22px}
.content > :first-child{margin-top:0}
.content h1,.content h2,.content h3{font-family:var(--font-head);font-weight:800;line-height:1.3;margin:1.1em 0 .4em}
.content h1{font-size:1.2rem}.content h2{font-size:1.05rem}.content h3{font-size:.96rem}
.content p{margin:0 0 .7em}
.content ul,.content ol{margin:0 0 .7em;padding-inline-start:1.35rem}
.content li{margin:.1em 0}
.content li > p{margin:0}
.content blockquote{margin:0 0 .7em;padding-inline-start:.75rem;border-inline-start:3px solid var(--line);color:var(--label)}
.content a{color:var(--blue);font-weight:500;text-decoration:none;cursor:text}
.content a.sel{background:var(--blue-light);border-radius:3px}
.content code{background:#F1F3F7;border-radius:4px;padding:.1em .35em;font-size:.9em}
.content hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.content img{max-width:100%;border-radius:10px;display:block;margin:.4em 0 .8em}
.content table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 .8em;font-size:.86rem}
.content th,.content td{border:1px solid var(--line);padding:.35em .55em;text-align:start;vertical-align:top}
.content th{background:var(--surface);font-weight:700}
.content td.cur,.content th.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.tasks{list-style:none;padding-inline-start:0!important}
.tasks li{display:flex;gap:.55em;align-items:flex-start}
.tasks input{margin-top:.35em;accent-color:var(--ink)}
.tasks li.done span{color:var(--muted);text-decoration:line-through}
.content details{border:1px solid var(--line);border-radius:10px;padding:.45em .7em;margin:0 0 .8em;background:#FCFCFD}
.content summary{font-weight:700;cursor:pointer}
.content summary:empty::before{content:attr(data-ph);color:var(--faint);font-weight:500}
.content .ph:empty::before{content:attr(data-ph);color:var(--faint)}
.blk{border:1px solid var(--line);border-radius:12px;margin:0 0 .8em;user-select:none}
.toc{padding:.6em .8em;background:var(--surface)}
.toc .t{font:700 .7rem var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.toc ol{margin:.3em 0 0;padding-inline-start:1.1rem;font-size:.84rem;color:var(--blue)}
.yt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;padding:8px}
.frame.phone .yt{grid-template-columns:110px minmax(0,1fr)}
.yt .thumb{aspect-ratio:16/9;border-radius:8px;background:linear-gradient(135deg,#1d2a4d,#3563E9);display:grid;place-items:center;max-width:100%}
.yt .thumb span{width:34px;height:24px;border-radius:7px;background:#F5334F;display:grid;place-items:center}
.yt .thumb span::after{content:"";border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #fff}
.yt .meta{min-width:0;font-size:.78rem;color:var(--label)}
.yt .meta b{display:block;color:var(--ink);font-size:.84rem}
.yt .meta div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--blue);background:var(--blue-light);color:var(--blue);border-radius:10px;padding:14px;font-weight:600;font-size:.82rem;margin:.4em 0 .8em;user-select:none}
.upl i{width:16px;height:16px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.content.empty-line-ph p.cur:empty::before{content:attr(data-ph);color:var(--faint)}

.foot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.note{font-size:.76rem;font-weight:600;color:var(--ink)}
.note.bad{color:var(--error)}

/* floating */
.float{position:absolute;z-index:20;background:var(--panel);border-radius:12px;box-shadow:0 12px 32px rgba(24,35,63,.16),0 0 0 1px var(--line);padding:5px}
.menu{min-width:220px;display:grid}
.mi{display:flex;align-items:center;gap:9px;padding:7px 9px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:start;font-size:.8rem;color:var(--ink)}
.mi:hover,.mi.hl,.mi:focus-visible{background:var(--blue-light);outline:none}
.mi[aria-disabled="true"]{opacity:.4;cursor:default;background:transparent}
.mi .ic{width:18px;display:grid;place-items:center;color:var(--label)}
.mi .hint{margin-inline-start:auto;font-size:.7rem;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
.mi .chk{margin-inline-start:auto;color:var(--blue);font-weight:800}
.mhead{font:700 .62rem var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 9px 3px}
.slash{width:260px;max-height:300px;overflow:auto}
.slash .q{font-size:.7rem;color:var(--faint);padding:4px 9px}
.card{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;max-width:360px}
.card .host{min-width:0;font-size:.78rem}
.card .host b{display:block;font-size:.8rem}
.card .host span{display:block;color:var(--label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.card a,.card button{flex:none;height:28px;display:inline-flex;align-items:center;gap:4px;border:0;border-radius:7px;padding:0 9px;font-size:.75rem;font-weight:700;cursor:pointer;background:var(--blue-light);color:var(--blue);text-decoration:none}
.card .rm{background:transparent;color:var(--error)}
.tmenu{display:flex;flex-wrap:wrap;gap:2px;padding:4px;max-width:520px}
.tmenu button{border:0;background:transparent;border-radius:7px;padding:5px 8px;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--ink)}
.tmenu button:hover{background:var(--blue-light);color:var(--blue)}
.tmenu .rm{color:var(--error)}
.tmenu .sep{width:1px;background:var(--line);margin:3px 2px}

.readview .content{cursor:default}
.readhead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--label);font-weight:600}
.toast{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--rail);color:#fff;border-radius:10px;padding:9px 14px;font-size:.78rem;font-weight:600;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>


<header class="top">
  <h1><i></i>Brief editor · preview</h1>
  <p>Spec 005 · a working mock-up, not the live app</p>
  <div class="controls">
    <div class="seg" role="group" aria-label="Device"><button id="devDesk" aria-pressed="true">Desktop</button><button id="devPhone" aria-pressed="false">Phone</button></div>
    <div class="seg" role="group" aria-label="Language"><button id="lnEn" aria-pressed="true">English</button><button id="lnAr" aria-pressed="false">العربية</button></div>
    <label class="switch" for="failSw"><input type="checkbox" id="failSw"> Simulate failing saves</label>
  </div>
</header>

<div class="layout">
  <nav class="tour" aria-label="Guided tour">
    <div class="tip" id="tip"></div>
    <h2>Try each change</h2>
    <div id="steps" style="display:grid;gap:6px"></div>
  </nav>

  <div class="stage">
    <div class="frame" id="frame">
      <div class="panel-head"><span class="crumb">Forefront · AI Pillar · Social Media</span><h3>AI Pillar SM Campaign – Post 2</h3></div>
      <div class="lbl"><span id="briefLbl">Brief</span><span class="hint2" id="editHint"></span></div>
      <div class="edwrap" id="edwrap">
        <div id="editView">
          <div class="ed viewing" id="ed">
            <div class="tb" role="toolbar" id="tb" aria-label="Formatting"></div>
            <div class="bar confirm" id="confirm" hidden role="alertdialog" aria-live="assertive"></div>
            <div class="bar prompt" id="prompt" hidden></div>
            <div class="content" id="content" contenteditable="false" role="textbox" aria-multiline="true" spellcheck="false"></div>
          </div>
          <div class="foot"><span class="note" id="note" role="status"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

function floatAt(el,anchorRect,opts={}){

}
function buildMenu(items,{onPick,checked}){

    const b=document.createElement('button'); b.className='mi'; b.setAttribute('role',checked!==undefined?'menuitemradio':'menuitem'); b.tabIndex=-1;
    if(checked!==undefined)b.setAttribute('aria-checked',String(it.id===checked));

    b.innerHTML=`<span class="ic">${it.ico?ic(it.ico):''}</span><span>${it.label}</span>${checked!==undefined&&it.id===checked?'<span class="chk">✓</span>':it.hint?`<span class="hint">${it.hint}</span>`:''}`;
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.onclick=()=>{if(it.disabled)return;onPick(it)};
    m.appendChild(b);
  });
  m.addEventListener('keydown',e=>{
    const list=[...m.querySelectorAll('.mi')]; const i=list.indexOf(document.activeElement);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=(i+(e.key==='ArrowDown'?1:-1)+list.length)%list.length;list[n].focus()}

function fakeScreenshot(){
  const c=document.createElement('canvas'); c.width=960; c.height=540; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,960,540); grd.addColorStop(0,'#18233F'); grd.addColorStop(1,'#3563E9'); g.fillStyle=grd; g.fillRect(0,0,960,540);
  g.fillStyle='#C8F24E'; g.fillRect(60,60,120,12);
  g.fillStyle='#fff'; g.font='bold 54px Montserrat, sans-serif'; g.fillText(lang==='ar'?'300 رقم.':'300 numbers.',60,170); g.fillText(lang==='ar'?'أين الفكرة؟':"Where's the insight?",60,240);
  g.fillStyle='#ffffff99'; g.font='24px Inter, sans-serif'; g.fillText('AI Pillar · Post 2 · reference',60,470);
  return new Promise(r=>c.toBlob(b=>r(new File([b],'reference-post.png',{type:'image/png'})),'image/png'));
}

let current=null;
function renderSteps(){
  $('#steps').innerHTML=STEPS.map(s=>`<button class="step" data-id="${s.id}" aria-current="${s.id===current}"><b>${s.title}</b><span>${s.sub}</span><span class="tags">${s.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</span></button>`).join('');
}
$('#steps').addEventListener('click',e=>{const b=e.target.closest('.step');if(!b)return;startStep(b.dataset.id)});
function startStep(id){
  const s=STEPS.find(x=>x.id===id); current=id; renderSteps(); closeAll(); hideCard(); note('');
  if(id!=='phone'&&frame.classList.contains('phone')&&id!=='arabic')setDevice('desk');
  if(id!=='arabic'&&lang==='ar')setLang('en');
  if(id!=='read')enterEdit();
  if(!['save','leave','paste'].includes(id))$('#failSw').checked=false;
  $('#tip').innerHTML=s.tip; setTimeout(()=>s.run(),60);
}

/* ---------- device & language ---------- */
function setDevice(d){frame.classList.toggle('phone',d==='phone');$('#devDesk').setAttribute('aria-pressed',String(d!=='phone'));$('#devPhone').setAttribute('aria-pressed',String(d==='phone'));closeAll();hideCard();tmenu?.remove();tmenu=null}
function setLang(l){lang=l;frame.dir=l==='ar'?'rtl':'ltr';frame.lang=l;$('#lnEn').setAttribute('aria-pressed',String(l==='en'));$('#lnAr').setAttribute('aria-pressed',String(l==='ar'));
  closeAll();hideCard();note('');tmenu?.remove();tmenu=null;content.innerHTML=CONTENT[l];if(!editing)content.querySelectorAll('a').forEach(x=>{x.target='_blank';x.rel='noopener noreferrer'});applyLabels();renderToolbar();renderToc()}
function applyLabels(){$('#briefLbl').textContent=t('brief');content.setAttribute('aria-label',t('brief'));content.dataset.ph=t('ph');$('#editHint').textContent=editing?t('editingHint'):t('clickToEdit');
  frame.querySelector('.panel-head h3').textContent=lang==='ar'?'حملة الذكاء الاصطناعي – المنشور 2':'AI Pillar SM Campaign – Post 2';
  frame.querySelector('.crumb').textContent=lang==='ar'?'فورفرونت · محور الذكاء الاصطناعي · سوشيال ميديا':'Forefront · AI Pillar · Social Media'}
$('#devDesk').onclick=()=>setDevice('desk'); $('#devPhone').onclick=()=>setDevice('phone');
$('#lnEn').onclick=()=>setLang('en'); $('#lnAr').onclick=()=>setLang('ar');

/* ---------- boot ---------- */
setLang('en'); renderSteps();
