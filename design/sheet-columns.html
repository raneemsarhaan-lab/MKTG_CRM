<!--
  Spec 010 design file: Sheet Columns You Can Shape (specs/010-sheet-custom-columns/contracts/columns-ui.md).
  A fully clickable mock of the Content sheet and the Video sheet with the new column tools:
    · header ▾ menu: Rename, Reset name, Insert before/after, Move left/right, Hide, Edit column, Delete
    · drag a heading to reorder; drag its edge to resize, double-click to fit
    · Columns panel: shown ticks, Move up/down, "Changed by …" (FR-004)
    · + Column / Edit column: name, seven kinds, Choice options and colours, the kind-change review
    · custom cells of every kind, with refused-value notes; delete with a count and 10 s Undo
    · Paste plan / Paste clips matching custom headings, and "Not imported → Add as a column"
  and every existing sheet behaviour, so the whole experience can be tried:
    · Viewing as (admin or user) to see read-only rows; Mine; Show archived; + Theme
    · theme rows (collapse, Edit theme, Add pillar, + Piece) and pillar rows (Rename, Remove)
    · title editing, Type and Status menus, Assignee, the four link cells, Task Link (task panel), Pillar, Date
    · Archive / Restore, + Piece drafts; on the Video sheet + Clip, Drop / Restore, Editing / Copy / Full
  Everyone may change columns (clarified 2026-11-05). Mock data; not the live app.
-->
<style>
/* Layout: the app's sheet toolbar and dense grid; popovers anchor to what opened them; the task panel slides in from the inline end. */
:root{
  --bg:#FFFFFF; --ink:#1B1A13; --muted:#5E6166; --grid:#E2E3E3; --head:#F3F4F2; --gutter:#F8F9F8;
  --frozen:#C9CBC9; --theme:#F4F8E4; --hover:#F6F8FB; --focus:#3563E9; --link:#1F5FD1;
  --lime:#C8F24E; --lime-ink:#1B1A13; --danger:#C81E3A; --danger-soft:#FDE7EA; --warn:#8A5300; --warn-soft:#FDF3E3;
  --pop:#FFFFFF; --shadow:0 8px 28px rgba(17,18,20,.16); --scrim:rgba(17,18,20,.45); --dropped:#6B6E72;
  --on-fill:#FFFFFF;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --font-head:'Montserrat','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181B; --ink:#E9E9E4; --muted:#A3A6AB; --grid:#2E3034; --head:#202226; --gutter:#1C1E21;
  --frozen:#3A3D42; --theme:#22261A; --hover:#1F2328; --focus:#7C9CFF; --link:#8AB0FF;
  --lime:#C8F24E; --lime-ink:#1B1A13; --danger:#FF7A8E; --danger-soft:#3A1C22; --warn:#F2B861; --warn-soft:#33281A;
  --pop:#202226; --shadow:0 10px 32px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); --dropped:#8B8E93; --on-fill:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181B; --ink:#E9E9E4; --muted:#A3A6AB; --grid:#2E3034; --head:#202226; --gutter:#1C1E21;
  --frozen:#3A3D42; --theme:#22261A; --hover:#1F2328; --focus:#7C9CFF; --link:#8AB0FF;
  --lime:#C8F24E; --lime-ink:#1B1A13; --danger:#FF7A8E; --danger-soft:#3A1C22; --warn:#F2B861; --warn-soft:#33281A;
  --pop:#202226; --shadow:0 10px 32px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); --dropped:#8B8E93; --on-fill:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font:12.5px/1.4 var(--font-body)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--grid)}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:999px;padding:2px;background:var(--head)}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.gap{flex:1}
.btn{border:1px solid var(--grid);background:var(--bg);border-radius:999px;padding:6px 13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[aria-expanded="true"]{background:var(--head)}
.btn.danger{background:var(--danger);color:var(--on-fill);border-color:var(--danger)}
.who-sel{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.who-sel select{border:1px solid var(--grid);border-radius:999px;padding:5px 10px;background:var(--bg)}
.try{display:flex;flex-wrap:wrap;gap:4px 16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--head);color:var(--muted);border-bottom:1px solid var(--grid)}
.try b{color:var(--ink)}
.sum{display:flex;flex-wrap:wrap;gap:4px 16px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);border-bottom:1px solid var(--grid)}
.sum b{color:var(--ink)}
.sum .bad{color:var(--warn);font-weight:700}
.boardview{padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;place-items:center;text-align:center;gap:10px;color:var(--muted)}
.boardview h2{margin:0;color:var(--ink);font:800 18px var(--font-head)}

/* grid */
.scroll{overflow:auto;max-height:calc(100vh - 180px)}
.grid{display:grid;width:max-content;min-width:100%}
.row{display:contents}
.c{height:34px;padding:0 8px;border-inline-end:1px solid var(--grid);border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:6px;min-width:0;background:var(--bg);position:relative;white-space:nowrap;cursor:default;outline:none}
.c.no{position:sticky;inset-inline-start:0;z-index:2;background:var(--gutter);color:var(--muted);justify-content:center;font-size:11px;font-variant-numeric:tabular-nums;padding:0;cursor:pointer}
.c.ti{position:sticky;inset-inline-start:40px;z-index:2;border-inline-end:2px solid var(--frozen)}
.c.act{cursor:pointer}
.th{position:sticky;top:0;z-index:3;background:var(--head);font-weight:600;cursor:grab;user-select:none}
.th.no,.th.ti{z-index:5;cursor:default}
.th .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.th .menu-b{opacity:0;border:0;background:transparent;border-radius:4px;width:20px;height:20px;cursor:pointer;color:var(--muted);flex:none}
.th:hover .menu-b,.th:focus-within .menu-b,.th .menu-b[aria-expanded="true"]{opacity:1}
.th .menu-b:hover{background:var(--grid)}
.th .rz{position:absolute;inset-block:0;inset-inline-end:-3px;width:6px;cursor:col-resize;z-index:4}
.th .rz:hover,.th .rz.on{background:var(--focus)}
.th.dragging{opacity:.45}
.th.drop-before::before{content:"";position:absolute;inset-block:0;inset-inline-start:-1px;width:3px;background:var(--focus);z-index:6}
.th .tag{font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--grid);border-radius:4px;padding:0 4px}
.row:hover>.c:not(.no){background:var(--hover)}
.row.theme>.c{background:var(--theme);font-weight:700}
.row.pillar>.c{background:var(--head);font-weight:600;font-size:11.5px}
.row.video>.c{background:var(--theme);font-weight:600}
.row.archived .txt,.row.archived .c:not(.no):not(.arch) .ty{text-decoration:line-through;color:var(--dropped)}
.row.archived .ty{background:var(--gutter)!important;color:var(--dropped);box-shadow:inset 0 0 0 1px var(--grid)}
.row.add>.c{border-bottom-color:transparent}
.plus{color:var(--muted);font-weight:600;cursor:pointer}
.plus:hover{color:var(--ink)}
.span{grid-column:2/-1}
.stick{position:sticky;inset-inline-start:48px;display:flex;align-items:center;gap:4px;min-width:0;max-width:calc(100vw - 80px)}
.stick .row-menu{margin-inline-start:6px}
.caret{width:16px;flex:none;text-align:center;color:var(--muted);cursor:pointer}
.ell{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mut{color:var(--muted)}
.ind{display:inline-block;width:14px;flex:none}
.row-menu{margin-inline-start:auto;border:0;background:transparent;border-radius:4px;width:22px;height:22px;cursor:pointer;color:var(--muted);opacity:0}
.row:hover .row-menu,.row-menu:focus-visible,.row-menu[aria-expanded="true"]{opacity:1}
.open-b{border:0;background:transparent;color:var(--muted);cursor:pointer;opacity:0;margin-inline-start:auto;padding:0 2px}
.row:hover .open-b,.c.active .open-b{opacity:1}
.c.active{box-shadow:inset 0 0 0 2px var(--focus);z-index:3}
.c input.cell-in{position:absolute;inset:0;border:0;outline:2px solid var(--focus);outline-offset:-2px;padding:0 8px;background:var(--pop);color:var(--ink);font:inherit;z-index:4}
.note{position:absolute;top:calc(100% - 2px);inset-inline-start:4px;z-index:7;background:var(--danger);color:var(--on-fill);font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;white-space:nowrap}
.note.info{background:var(--ink);color:var(--bg)}
.arch-b{color:var(--muted);font-weight:600;font-size:11.5px;cursor:pointer}
.arch-b:hover{color:var(--ink);text-decoration:underline}

/* pills and chips */
.st{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 7px;border:1px solid var(--grid);border-radius:999px;font-weight:600;font-size:11px;background:var(--bg)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.ty,.pill{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:999px;color:var(--on-fill);font-weight:600;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.person{display:inline-flex;align-items:center;gap:6px;min-width:0}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:var(--on-fill);font:700 8.5px var(--font-head);flex:none}
.av.empty{border:1.5px dashed var(--frozen);background:transparent}
.lnk{color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.num{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.cb.on{background:var(--focus);border-color:var(--focus);color:var(--on-fill)}
.miss{color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:0 5px;font-weight:600;font-size:11px}

/* popovers, menus, dialogs */
.pop{position:fixed;z-index:40;background:var(--pop);border:1px solid var(--grid);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;max-width:min(380px,calc(100vw - 24px));max-height:min(520px,calc(100vh - 24px));overflow:auto}
.mi{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;border-radius:6px;padding:7px 9px;text-align:start;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
.mi small{margin-inline-start:auto;color:var(--muted)}
.mi.danger{color:var(--danger)}
.mi.next{background:var(--lime);color:var(--lime-ink)}
.mi[disabled]{opacity:.45;cursor:default}
.sep{height:1px;background:var(--grid);margin:4px 2px}
.ph{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 9px 2px}
.field{display:grid;gap:4px;padding:6px 8px}
.field label,.field .lbl{font-weight:600}
.in{font:inherit;border:1px solid var(--grid);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);width:100%}
.row2{display:flex;gap:6px;align-items:center}
.err{color:var(--danger);font-weight:600;font-size:11.5px;min-height:15px}
.acts{display:flex;justify-content:flex-end;gap:6px;padding:6px 8px}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px 8px}
.kind{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--grid);border-radius:8px;padding:7px;cursor:pointer;text-align:start;background:var(--bg)}
.kind[aria-checked="true"]{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.kind .ki{width:22px;height:22px;border-radius:6px;background:var(--head);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.kind b{display:block;font-size:12px}
.kind span{display:block;font-size:11px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:6px;padding:3px 8px}
.sw{width:22px;height:22px;border-radius:6px;border:0;cursor:pointer;flex:none}
.ib{border:1px solid var(--grid);background:var(--bg);border-radius:6px;width:26px;height:26px;cursor:pointer;flex:none}
.ib[disabled]{opacity:.4;cursor:default}
.review{margin:4px 8px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.panel-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px}
.panel-row:hover{background:var(--hover)}
.panel-row .who{display:block;font-size:11px;color:var(--muted)}
.panel-row .grow{flex:1;min-width:0}
.checks{display:grid;gap:4px;padding:2px 8px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--pop);border-radius:12px;box-shadow:var(--shadow);width:min(600px,100%);max-height:calc(100% - 32px);overflow:auto;padding:14px 16px;display:grid;gap:10px}
.dlg h2{margin:0;font:800 15px var(--font-head)}
.dlg p{margin:0;color:var(--muted)}
.dlg textarea{font:12px ui-monospace,monospace;border:1px dashed var(--frozen);border-radius:8px;padding:8px;min-height:64px;background:var(--gutter);color:var(--ink);width:100%;resize:vertical}
.ptab{width:100%;border-collapse:collapse}
.ptab th,.ptab td{text-align:start;padding:5px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--grid)}
.chip.ok{border-color:transparent;background:var(--lime);color:var(--lime-ink)}
.chip.bad{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font-weight:600;display:flex;gap:12px;align-items:center;z-index:60;max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:var(--lime);font-weight:700;cursor:pointer;text-decoration:underline}

/* task panel */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100vw);background:var(--pop);box-shadow:var(--shadow);z-index:55;display:flex;flex-direction:column;border-inline-start:1px solid var(--grid);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;gap:10px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--grid)}
.drawer h2{margin:0;font:800 16px var(--font-head);flex:1;text-wrap:balance}
.drawer .body{flex:1;overflow:auto;padding:12px 16px;display:grid;gap:4px;align-content:start}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center;min-height:30px;border-bottom:1px solid var(--grid)}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0}
.cmt{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--grid)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<header class="bar" role="toolbar" aria-label="Sheet">
  <div class="seg" role="group" aria-label="View"><button aria-pressed="false" data-view="board">Board</button><button aria-pressed="false" data-view="video">Sheet</button><button aria-pressed="true" data-view="content">Content</button></div>
  <div class="seg" role="group" aria-label="Video column set" id="sets" hidden><button aria-pressed="true" data-set="editing">Editing</button><button aria-pressed="false" data-set="copy">Copy</button><button aria-pressed="false" data-set="full">Full</button></div>
  <label class="who-sel">Viewing as <select id="viewer" aria-label="Viewing as"><option value="samaa">Samaa · Content lead (admin)</option><option value="mariam">Mariam · Graphic Designer (user)</option><option value="lina">Lina · Video Editor (user)</option></select></label>

</div>

<div class="scroll" id="scroll"><div class="grid" id="grid" role="treegrid" aria-label="Content plan"></div></div>

<script>
'use strict';
/* ---------- tokens shared with the app (CHOICE_COLORS, CONTENT_TYPE_COLORS, stage pills) ---------- */
const CHOICE_COLORS=['#1D4ED8','#BE185D','#7E22CE','#0F766E','#B45309','#4338CA','#C2410C','#334155','#A21CAF','#0369A1'];
const TYPE={Post:'#1D4ED8',Reel:'#BE185D',Video:'#7E22CE',Article:'#0F766E',Report:'#B45309','Framework/Model':'#4338CA',Story:'#C2410C',Deck:'#334155'};
const STAGE={todo:['Planned','#64748B'],'c-prog':['Writing','#3B82F6'],'c-final':['Content Review','#2E6FB0'],'r-design':['Ready for Design','#8B5CF6'],'d-prog':['Initial Design','#7C3AED'],'d-check':['Final Design','#5B3FB5'],'ready-publish':['Ready to Publish','#0EA5E9'],publish:['Published','#22C55E']};
const VSTAGE={todo:['To Do','#64748B'],'c-prog':['Script','#3B82F6'],'c-final':['Script Review','#2E6FB0'],'r-design':['Ready to Edit','#8B5CF6'],'d-prog':['Editing','#7C3AED'],'d-check':['Edit Review','#5B3FB5'],'final-check':['Final Cut','#F59E0B'],publish:['Published','#22C55E']};
const REAL={todo:'To Do','c-prog':'C-In Progress','c-final':'C-Review','r-design':'Ready For Design','d-prog':'D-In Progress','d-check':'D-Check','final-check':'F-Check','ready-publish':'Ready to Publish',publish:'Published'};
const PEOPLE={samaa:['Samaa','Content Creator','#6E5BE6'],noran:['Noran','Content Creator','#E0736A'],mariam:['Mariam','Graphic Designer','#3FA34D'],omar:['Omar','Video Editor','#5B6066'],lina:['Lina','Video Editor','#5B93F5']};
const ADMINS=['samaa'];
const AUDIENCE=['C-Level of large companies','Strategy Heads','Top Management','2nd Line Management'];
const KINDS=[['text','Aa','Text','Any words'],['number','#','Number','Counts and amounts'],['date','▦','Date','A day, e.g. 20/11/2026'],['link','↗','Link','A web address'],['person','☺','Person','One team member'],['choice','◉','Choice','One option from a list'],['checkbox','☑','Checkbox','Yes or no']];
const ago=m=>m<1?'just now':m<60?`${m} min ago`:`${Math.round(m/60)}h ago`;
const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const $=s=>document.querySelector(s);
const site=u=>{ try{ const h=new URL(u).hostname.replace(/^www\./,''); return {'docs.google.com':'Google Docs','drive.google.com':'Google Drive','linkedin.com':'LinkedIn','canva.com':'Canva','figma.com':'Figma'}[h]||h }catch{ return u } };
const isLink=u=>/^https?:\/\/[^\s/]+\.[^\s]+$/i.test(u.trim());
const ymd=d=>d.toISOString().slice(0,10);
const short=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
let uid=100;

/* ---------- state ---------- */
const S={

function customHtml(c,val){
  if(val==null||val==='') return c.kind==='checkbox'?'<span class="cb" aria-hidden="true"></span>':'';
  switch(c.kind){
    case 'text': return `<span class="ell">${esc(val)}</span>`;
    case 'number': return `<span class="num">${Number(val).toLocaleString('en')}</span>`;
    case 'date': return new Date(val+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    case 'link': return `<span class="lnk ell">${esc(site(val))}</span>`;
    case 'person': return person(val);
    case 'choice': { const o=(c.options||[]).find(x=>x.id===val); return o?`<span class="pill" style="background:${o.color}">${esc(o.name)}</span>`:'' }
    case 'checkbox': return '<span class="cb on" aria-hidden="true">✓</span>';
  }
}

function contentRows(){
  const out=[], mine=p=>!S.mine||p.assignee===S.me||p.owner===S.me, keep=p=>(S.showArch||!p.archived)&&mine(p);
  for(const t of S.content.themes){
    const ps=S.content.pieces.filter(p=>p.theme===t.id);
    out.push({key:'t:'+t.id,kind:'theme',t,count:ps.filter(p=>!p.archived).length});
    if(t.collapsed) continue;
    for(const pl of t.pillars){
      const pp=ps.filter(p=>p.pillar===pl.id&&keep(p));
      out.push({key:'p:'+pl.id,kind:'pillar',t,pl,count:pp.length});
      pp.forEach(p=>out.push({key:'k:'+p.id,kind:'piece',p,deep:2}));
    }
    ps.filter(p=>!p.pillar&&keep(p)).forEach(p=>out.push({key:'k:'+p.id,kind:'piece',p,deep:1}));
    if(S.draft?.theme===t.id) out.push({key:'d:'+t.id,kind:'draft',t});
    out.push({key:'a:'+t.id,kind:'add',t});
  }
  return out;
}
function videoRows(){
  const v=S.video.video, out=[{key:'v:main',kind:'video',c:v}];
  if(!v.collapsed){
    S.video.clips.filter(c=>(S.showArch||!c.dropped)&&(!S.mine||c.editor===S.me)).forEach(c=>out.push({key:'c:'+c.id,kind:'clip',c}));
    if(S.draft?.video) out.push({key:'d:clip',kind:'draft'});
    out.push({key:'a:clip',kind:'add'});
  }
  return out;
}

/* ---------- popovers ---------- */
let anchorEl=null;
function closePop(restore=true){ $('#layer').innerHTML=''; document.querySelectorAll('[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false')); if(restore&&anchorEl?.isConnected) anchorEl.focus(); anchorEl=null }
function openPop(anchor,html,{wide}={}){
  closePop(false); anchorEl=anchor; anchor.setAttribute?.('aria-expanded','true');
  const p=document.createElement('div'); p.className='pop'; p.innerHTML=html; if(wide) p.style.minWidth='320px';
  $('#layer').appendChild(p);
  const r=anchor.getBoundingClientRect(), rtl=getComputedStyle(document.documentElement).direction==='rtl';
  let left=rtl?r.right-p.offsetWidth:r.left; left=Math.max(8,Math.min(left,innerWidth-p.offsetWidth-8));
  let top=r.bottom+4; if(top+p.offsetHeight>innerHeight-8) top=Math.max(8,r.top-p.offsetHeight-4);
  p.style.left=left+'px'; p.style.top=top+'px';
  requestAnimationFrame(()=>p.querySelector('input:not([type="checkbox"]),button:not([disabled]),input')?.focus());
  return p;
}
function menu(anchor,label,items,pick){
  const p=openPop(anchor,`<div role="menu" aria-label="${esc(label)}">${items.map(it=>it.sep?'<div class="sep"></div>':it.head?`<div class="ph">${esc(it.head)}</div>`:`<button class="mi${it.cls?' '+it.cls:''}" role="menuitem" data-v="${esc(it.v)}" ${it.disabled?'disabled':''}>${it.html}${it.hint?`<small>${esc(it.hint)}</small>`:''}</button>`).join('')}</div>`);
  p.onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b||b.disabled) return; closePop(); pick(b.dataset.v) };
  p.addEventListener('keydown',e=>{ const its=[...p.querySelectorAll('[role="menuitem"]:not([disabled])')], i=its.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();its[(i+1)%its.length]?.focus()} if(e.key==='ArrowUp'){e.preventDefault();its[(i-1+its.length)%its.length]?.focus()}
    if(e.key.length===1&&/\S/.test(e.key)){ const j=its.findIndex(x=>x.textContent.trim().toLowerCase().startsWith(e.key.toLowerCase())); if(j>=0) its[j].focus() } });
  return p;
}
function toast(msg,undo){
  const t=$('#toast'); clearTimeout(toast.h); t.hidden=false;
  t.innerHTML=`<span>${msg}</span>${undo?'<button id="undoBtn">Undo</button>':''}`;
  if(undo) $('#undoBtn').onclick=()=>{ undo(); t.hidden=true };
  toast.h=setTimeout(()=>{t.hidden=true},undo?10000:2800);
}

/* ---------- column tools ---------- */
function colMenu(key,anchor){
  const c=col(key), cols=visible(), i=cols.indexOf(c), ti=key==='title';
  const items=[{v:'rename',html:'Rename…'}];
  if(c.builtIn&&c.name) items.push({v:'reset',html:'Reset name',hint:c.def||c.label});
  items.push({sep:1});
  if(!ti) items.push({v:'before',html:'Insert column before…'});
  items.push({v:'after',html:'Insert column after…'},{sep:1},
    {v:'left',html:'Move left',disabled:ti||i<=1},{v:'right',html:'Move right',disabled:ti||i===cols.length-1});
  if(!ti) items.push({v:'hide',html:'Hide',hint:S.view==='video'?`in ${S.set[0].toUpperCase()+S.set.slice(1)}`:''});
  if(c.kind) items.push({sep:1},{v:'edit',html:'Edit column…'},{v:'delete',html:'Delete column…',cls:'danger'});
  menu(anchor,`Column ${labelOf(c)}`,items,a=>{
    if(a==='rename') renamePop(key,anchor);
    else if(a==='reset'){ delete c.name; stamp(c); render(); toast(`Reset to “${c.def||c.label}”`) }
    else if(a==='before'||a==='after') editor(null,anchor,{rel:a,key});
    else if(a==='left'||a==='right'){ move(key,a==='left'?-1:1); render(); toast(`Moved ${labelOf(c)} ${a}`) }
    else if(a==='hide'){ hide(c,true); render(); toast(`${labelOf(c)} hidden. Show it again from Columns.`) }
    else if(a==='edit') editor(c,anchor);
    else if(a==='delete') delConfirm(c);
  });
}
function renamePop(key,anchor){
  const c=col(key);
  const p=openPop(anchor,`<form class="field" id="rnF"><label for="rn">Column name</label><input class="in" id="rn" maxlength="40" value="${esc(nameOf(c))}" placeholder="${esc(c.def||c.label||'')}"><span class="err" id="rnE" role="alert"></span><div class="acts"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary">Rename</button></div></form>`);
  p.querySelector('[data-x]').onclick=()=>closePop();
  p.querySelector('#rnF').onsubmit=e=>{ e.preventDefault(); const v=p.querySelector('#rn').value.trim().replace(/\s+/g,' ');
    const err=checkName(v,key); if(err){ p.querySelector('#rnE').textContent=err; return }
    if(c.builtIn&&v===c.def) delete c.name; else c.name=v; stamp(c); closePop(); render(); toast(`Renamed to “${v}”`) };
  setTimeout(()=>p.querySelector('#rn').select(),0);
}
function checkName(v,except){
  if(!v) return 'A column needs a name.';
  if(v.length>40) return 'Keep it to 40 characters.';
  if(sheet().cols.some(c=>c.key!==except&&(nameOf(c).toLowerCase()===v.toLowerCase()||(c.def||'').toLowerCase()===v.toLowerCase()))) return `“${v}” is already a column here.`;
  return '';
}
function move(key,d){ const cs=sheet().cols, vis=visible(), c=col(key), t=vis[vis.indexOf(c)+d]; if(!t||t.key==='title') return; cs.splice(cs.indexOf(c),1); cs.splice(cs.indexOf(t)+(d>0?1:0),0,c); stamp(c) }
function moveBefore(key,beforeKey){ const cs=sheet().cols, c=col(key); cs.splice(cs.indexOf(c),1); const at=beforeKey?cs.indexOf(col(beforeKey)):cs.length; cs.splice(Math.max(1,at),0,c); stamp(c) }
function hide(c,h){ if(S.view==='video'){ const sets=new Set(c.sets??['full','editing','copy']); h?sets.delete(S.set):sets.add(S.set); c.sets=[...sets] } else c.hidden=h; stamp(c) }
function panel(){
  const anchor=$('#colsBtn'), cs=sheet().cols;
  const p=openPop(anchor,`<div role="dialog" aria-label="Columns" data-columns-panel><div class="ph">Columns${S.view==='video'?' · '+S.set[0].toUpperCase()+S.set.slice(1)+' set':''} · everyone sees these</div>

      <label class="grow" for="sh-${c.key}"><span class="ell" style="display:block">${esc(labelOf(c))}${c.kind?` <span class="mut">· ${KINDS.find(k=>k[0]===c.kind)[2]}</span>`:''}</span><span class="who" id="who-${c.key}">${c.who?`Changed by ${c.who[0]==='you'?'you':PEOPLE[c.who[0]][0]}, ${c.who[0]==='you'?'just now':ago(c.who[1])}`:'Default'}</span></label>

    <div class="sep"></div><button class="mi" data-add>+ Column</button></div>`,{wide:true});
  p.onchange=e=>{ const k=e.target.dataset.sh; if(!k) return; hide(col(k),!e.target.checked); render(); panel(); document.getElementById('sh-'+k)?.focus() };

function editor(c,anchor,ins){
  const isNew=!c, draft={name:c?nameOf(c):'',kind:c?.kind??'text',options:JSON.parse(JSON.stringify(c?.options??[{id:'o1',name:'Option 1',color:CHOICE_COLORS[0]}]))};
  const draw=()=>{
    const p=openPop(anchor,`<form id="edF" data-column-editor><div class="ph">${isNew?'Add a column':'Edit column'}${ins?` · ${ins.rel} ${esc(labelOf(col(ins.key)))}`:''}${S.view==='video'&&isNew?` · shown in Full and ${S.set[0].toUpperCase()+S.set.slice(1)}`:''}</div>
      <div class="field"><label for="edN">Name</label><input class="in" id="edN" maxlength="40" value="${esc(draft.name)}" placeholder="e.g. Hook"><span class="err" id="edE" role="alert"></span></div>
      <div class="ph">Kind</div><div class="kinds" role="radiogroup" aria-label="Kind">${KINDS.map(k=>`<button type="button" class="kind" role="radio" aria-checked="${draft.kind===k[0]}" data-k="${k[0]}"><span class="ki" aria-hidden="true">${k[1]}</span><span><b>${k[2]}</b><span>${k[3]}</span></span></button>`).join('')}</div>
      ${draft.kind==='choice'?`<div class="ph">Options</div>${draft.options.map((o,i)=>`<div class="opt"><button type="button" class="sw" style="background:${o.color}" data-sw="${i}" aria-label="Change colour of ${esc(o.name)}"></button><input class="in" data-on="${i}" value="${esc(o.name)}" aria-label="Option ${i+1}"><button type="button" class="ib" data-rm="${i}" aria-label="Remove ${esc(o.name)}">×</button></div>`).join('')}<div class="acts" style="justify-content:flex-start"><button type="button" class="btn" data-addopt>+ Option</button></div>`:''}
      ${!isNew&&c.kind!==draft.kind?`<div class="review" role="status">${reviewText(c,draft.kind)}</div>`:''}
      <div class="acts"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary">${isNew?'Add column':'Save'}</button></div></form>`,{wide:true});
    p.querySelector('[data-x]').onclick=()=>closePop();
    p.querySelector('#edN').oninput=e=>draft.name=e.target.value;
    p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{draft.kind=b.dataset.k;draw();document.querySelector(`[data-k="${draft.kind}"]`)?.focus()});
    p.querySelectorAll('[data-on]').forEach(i=>i.oninput=()=>draft.options[+i.dataset.on].name=i.value);
    p.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const o=draft.options[+b.dataset.sw];o.color=CHOICE_COLORS[(CHOICE_COLORS.indexOf(o.color)+1)%CHOICE_COLORS.length];draw()});
    p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const o=draft.options[+b.dataset.rm], used=allItems().filter(x=>x.v?.[c?.key]===o.id).length; if(used&&!confirmInline(p,`${used} rows use “${o.name}”. They'll be cleared.`)) return; draft.options.splice(+b.dataset.rm,1);draw()});
    p.querySelector('[data-addopt]')?.addEventListener('click',()=>{draft.options.push({id:'o'+(uid++),name:`Option ${draft.options.length+1}`,color:CHOICE_COLORS[draft.options.length%CHOICE_COLORS.length]});draw()});
    p.querySelector('#edF').onsubmit=e=>{ e.preventDefault(); const v=draft.name.trim().replace(/\s+/g,' '), err=checkName(v,c?.key); if(err){p.querySelector('#edE').textContent=err;return}
      if(isNew){ if(sheet().cols.filter(x=>x.kind).length>=30){ p.querySelector('#edE').textContent='This sheet has 30 custom columns, the most it can hold.'; return }
        const nc={key:'c:'+(uid++),name:v,kind:draft.kind,w:140,options:draft.kind==='choice'?draft.options:undefined,who:['you',0]}; if(S.view==='video') nc.sets=['full',S.set];
        const cs=sheet().cols, at=ins?cs.indexOf(col(ins.key))+(ins.rel==='after'?1:0):cs.length; cs.splice(Math.max(1,at),0,nc); closePop(); render(); toast(`Added “${v}”`) }
      else { if(c.kind!==draft.kind) convert(c,draft.kind); c.name=v; c.kind=draft.kind; c.options=draft.kind==='choice'?draft.options:c.options; stamp(c); closePop(); render(); toast(`Saved “${v}”`) } };
    p.querySelector('#edN').focus();
  };
  draw();
}
function confirmInline(p,msg){ if(p.dataset.ok===msg) return true; p.dataset.ok=msg; const r=document.createElement('div'); r.className='review'; r.textContent=msg+' Press × again to confirm.'; p.querySelector('.acts').before(r); return false }
const allItems=()=>S.view==='content'?S.content.pieces:S.video.clips;
function fits(kind,val){ if(kind==='text') return true; if(kind==='number') return !isNaN(Number(val)); if(kind==='date') return /^\d{4}-\d{2}-\d{2}$/.test(val); if(kind==='checkbox') return val==='1'; if(kind==='link') return isLink(val); return false }
function reviewText(c,kind){ const vals=allItems().filter(r=>r.v?.[c.key]); const bad=vals.filter(r=>!fits(kind,String(r.v[c.key]))); const K=KINDS.find(k=>k[0]===kind)[2]; return bad.length?`${bad.length} of ${vals.length} values won't fit ${K} and will be cleared: ${bad.slice(0,2).map(r=>`“${esc(String(r.v[c.key]).slice(0,24))}”`).join(', ')}${bad.length>2?'…':''}`:`All ${vals.length} values fit ${K}.` }
function convert(c,kind){ for(const r of allItems()) if(r.v?.[c.key]&&!fits(kind,String(r.v[c.key]))) delete r.v[c.key] }
function delConfirm(c){
  const count=allItems().filter(r=>r.v?.[c.key]).length;
  $('#layer').innerHTML=`<div class="scrim"><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlT"><h2 id="dlT">Delete ${esc(labelOf(c))}?</h2><p>${count} ${count===1?'row has':'rows have'} a value. This removes the column and its values for everyone.</p><div class="acts"><button class="btn" data-x>Cancel</button><button class="btn danger" data-del>Delete column</button></div></div></div>`;
  $('[data-del]').focus();
  $('[data-x]').onclick=()=>{ $('#layer').innerHTML='' };
  $('[data-del]').onclick=()=>{ const cs=sheet().cols, at=cs.indexOf(c); cs.splice(at,1); $('#layer').innerHTML=''; render();
    toast(`${esc(labelOf(c))} deleted`,()=>{ sheet().cols.splice(at,0,c); render(); toast(`${esc(labelOf(c))} restored, with its values`) }) };
}

/* ---------- link prompt ---------- */
function linkPrompt(anchor,label,current,save){

/* ---------- cell actions ---------- */
const STAGES_C=Object.keys(STAGE), STAGES_V=Object.keys(VSTAGE);
function statusMenu(it,anchor,map,order,cellId){
  const i=order.indexOf(it.status), next=order[i+1], back=order.slice(0,i).reverse(), skip=order.slice(i+2);
  const items=[];
  if(next) items.push({head:'Next'},{v:next,html:stagePill(map,next,false),hint:REAL[next],cls:'next'});
  if(back.length) items.push({head:'Back to'},...back.map(s=>({v:s,html:stagePill(map,s,false),hint:REAL[s]})));
  if(skip.length) items.push({head:'Skip to'},...skip.map(s=>({v:s,html:stagePill(map,s,false),hint:REAL[s]})));
  menu(anchor,'Status',items,s=>{
    const forward=order.indexOf(s)>i; it.status=s; if(s==='publish') it.pub=ymd(new Date());
    render(); toast(`Moved to ${map[s][0]}${forward&&canEdit(it)&&!isAdmin()?' · 🎉 your own stage, forward':''}`);
    if(s==='publish'&&!it.published){ const cellEl=document.querySelector(`[data-cell="${CSS.escape(cellId.replace(/\|.*/,'|published'))}"]`)||anchor;
      linkPrompt(cellEl,'Published! Paste the published link',it.published,v=>{ it.published=v; if(S.view==='content'&&it.type==='Post'&&!it.post){ setTimeout(()=>linkPrompt(cellEl,'And the LinkedIn link',it.post,w=>{it.post=w}),50) } }) }
  });
}
function act(id,anchor){
  const [rk,key]=id.split('|'), kind=rk.split(':')[0];
  if(kind==='a'){ if(anchor.querySelector('.plus')){ S.draft=S.view==='video'?{video:true}:{theme:rk.slice(2)}; render() } return }
  if(kind==='t'){ if(key==='rowNo'||key==='title') themeMenu(rk.slice(2),anchor); return }
  if(kind==='p'){ const [tid,pid]=[document.querySelector(`[data-pillar-menu$="|${rk.slice(2)}"]`)?.dataset.pillarMenu.split('|')[0],rk.slice(2)]; pillarMenu(tid,pid,anchor); return }
  const it=itemOf(rk), c=col(key), can=canEdit(it), gone=it.archived||it.dropped;
  if(key==='rowNo'){ rowMenu(rk,it,anchor); return }
  if(key==='task'){ openTask(rk); return }
  if(c?.kind){
    if(kind==='v') return;
    if(!can||gone){ note(id,gone?'Restore it to edit':"You can't edit this row"); return }
    const v=it.v||(it.v={});
    if(['text','number','date'].includes(c.kind)){ editStart(id,v[key]??''); return }
    if(c.kind==='link'){ linkPrompt(anchor,`${labelOf(c)} link`,v[key],u=>{ if(u) v[key]=u; else delete v[key] }); return }
    if(c.kind==='checkbox'){ if(v[key]) delete v[key]; else v[key]='1'; render(); return }
    if(c.kind==='person') return menu(anchor,labelOf(c),[...Object.keys(PEOPLE).map(p=>({v:p,html:person(p),hint:PEOPLE[p][1],cls:v[key]===p?'next':''})),{sep:1},{v:'',html:person(null,'Clear')}],p=>{ if(p) v[key]=p; else delete v[key]; render() });
    if(c.kind==='choice') return menu(anchor,labelOf(c),[...c.options.map(o=>({v:o.id,html:`<span class="pill" style="background:${o.color}">${esc(o.name)}</span>`,cls:v[key]===o.id?'next':''})),{sep:1},{v:'',html:'Clear'}],o=>{ if(o) v[key]=o; else delete v[key]; render() });
    return;
  }
  if(key==='title'){ if(!can||gone){ note(id,gone?'Restore it to edit':"You can't edit this row"); return } editStart(id,it.name); return }
  if(key==='archive'||key==='drop'){ if(!can) return; if(gone){ it.archived=false; it.dropped=false; render(); toast(`${esc(it.name)} restored`) } else archiveConfirm(it,anchor,key==='drop'); return }
  if(gone&&key!=='published'&&key!=='doc'&&key!=='design'&&key!=='post'){ note(id,'Restore it to edit'); return }
  if(key==='status'){ if(!can) return note(id,`Only ${it.assignee?PEOPLE[it.assignee][0]:'its owner'} or an admin can move this`); return statusMenu(it,anchor,S.view==='content'?STAGE:VSTAGE,S.view==='content'?STAGES_C:STAGES_V,id) }
  if(key==='type'&&S.view==='content'){ if(!can) return note(id,"You can't edit this row"); return menu(anchor,'Type',Object.keys(TYPE).map(t=>({v:t,html:`<span class="ty" style="background:${TYPE[t]}">${t}</span>`,cls:it.type===t?'next':''})),t=>{ it.type=t; render(); toast(`Type set to ${t}`) }) }
  if(key==='assignee'||key==='editor'){ if(!can) return note(id,"You can't edit this row"); const f=key; return menu(anchor,key==='editor'?'Editor':'Assignee',[...Object.keys(PEOPLE).map(p=>({v:p,html:person(p),hint:PEOPLE[p][1],cls:it[f]===p?'next':''})),{sep:1},{v:'',html:person(null)}],p=>{ it[f]=p||null; render(); toast(p?`Assigned to ${PEOPLE[p][0]}`:'Unassigned') }) }
  if(['doc','design','post','published'].includes(key)){ const url=it[key]; if(!can||gone){ if(url) toast(`Opens ${site(url)} in a new tab`); return } const lab={doc:'Working doc',design:'Design',post:'LinkedIn',published:'Published'}[key]; return linkPrompt(anchor,`${lab} link for ${it.name}`,url,v=>{ it[key]=v }) }
  if(key==='pillar'){ if(!can) return note(id,"You can't edit this row"); const t=themeOf(it.theme); return menu(anchor,'Pillar',[...t.pillars.map(pl=>({v:pl.id,html:esc(pl.name),cls:it.pillar===pl.id?'next':''})),{sep:1},{v:'',html:'No pillar'}],v=>{ it.pillar=v||null; render() }) }
  if(key==='date'){ if(!can) return note(id,"You can't edit this row"); if(it.status==='publish') return note(id,'Published: the date is the publish day',true); return editStart(id,it.due||'') }
  if(key==='source'||key==='fileName'){ if(!can) return note(id,"You can't edit this row"); return editStart(id,key==='source'?it.source:it.file) }
  if(key==='clipNo'||key==='length') return note(id,key==='length'?'Worked out from the file name':'From the file name',true);
}
function editStart(id,val){ S.editing=id; S.editVal=val; render(); const i=$('#in'); if(i){ i.value=val; i.setSelectionRange(val.length,val.length) } }
function commit(id,raw){
  const [rk,key]=id.split('|'), it=itemOf(rk), c=col(key); raw=raw.trim(); delete S.notes[id];
  if(c?.kind){ const v=it.v||(it.v={}); if(!raw){ delete v[key]; return true }
    let val=raw;
    if(c.kind==='number'){ if(isNaN(Number(raw.replace(/,/g,'')))){ note(id,'Not a number'); return false } val=String(Number(raw.replace(/,/g,''))) }
    if(c.kind==='date'){ const m=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); val=m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:raw; if(!/^\d{4}-\d{2}-\d{2}$/.test(val)){ note(id,'Not a date: use 2026-11-20 or 20/11/2026'); return false } }
    v[key]=val; return true }
  if(key==='title'){ if(!raw){ note(id,'A title is needed'); return false } it.name=raw; return true }
  if(key==='date'){ if(!raw){ it.due=''; return true } const m=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); const val=m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:raw; if(!/^\d{4}-\d{2}-\d{2}$/.test(val)){ note(id,'Not a date: use 2026-11-20 or 20/11/2026'); return false } it.due=val; return true }
  if(key==='source'){ it.source=raw; return true }
  if(key==='fileName'){ it.file=raw; const m=raw.match(/(\d+)m([\d.]+)s-(\d+)m([\d.]+)s/); if(m){ const len=(+m[3]*60+ +m[4])-(+m[1]*60+ +m[2]); it.len=`${Math.floor(len/60)}:${(len%60).toFixed(1).padStart(4,'0')}` } return true }
  return true;
}

}
function pillarMenu(tid,pid,anchor){
  const t=themeOf(tid), pl=t.pillars.find(x=>x.id===pid), mayEdit=isAdmin()||t.owner===S.me;
  menu(anchor,`Pillar ${pl.name}`,[{v:'rename',html:'Rename…',disabled:!mayEdit},{v:'remove',html:'Remove pillar',cls:'danger',disabled:!mayEdit}],a=>{
    if(a==='rename') namePrompt(anchor,'Pillar name',pl.name,v=>{ pl.name=v; render() });
    else { t.pillars=t.pillars.filter(x=>x!==pl); S.content.pieces.filter(p=>p.pillar===pid).forEach(p=>p.pillar=null); render(); toast(`Pillar “${pl.name}” removed · its pieces stay in the theme`) }
  });
}
function namePrompt(anchor,label,val,save){
  const p=openPop(anchor,`<form class="field" id="npF"><label for="np">${esc(label)}</label><input class="in" id="np" value="${esc(val)}"><div class="acts"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary">Save</button></div></form>`);
  p.querySelector('[data-x]').onclick=()=>closePop();
  p.querySelector('#npF').onsubmit=e=>{ e.preventDefault(); const v=p.querySelector('#np').value.trim(); if(!v) return; closePop(); save(v) };
}
function themeEditor(t,anchor){
  const p=openPop(anchor,`<form id="thF"><div class="ph">Edit theme</div>
    <div class="field"><label for="thN">Name</label><input class="in" id="thN" value="${esc(t.name)}"></div>
    <div class="field"><label for="thO">Owner</label><select class="in" id="thO">${Object.keys(PEOPLE).map(p=>`<option value="${p}" ${t.owner===p?'selected':''}>${PEOPLE[p][0]}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Frequency</span><div class="row2"><input class="in" id="thF1" type="number" min="1" max="30" value="${t.freq}" style="width:80px" aria-label="Pieces"><select class="in" id="thP" aria-label="Per"><option value="week" ${t.period==='week'?'selected':''}>per week</option><option value="month" ${t.period==='month'?'selected':''}>per month</option></select></div></div>
    <div class="ph">Target audience</div><div class="checks">${AUDIENCE.map((a,i)=>`<label><input type="checkbox" data-aud="${i}" ${t.audience.includes(i)?'checked':''}>${a}</label>`).join('')}</div>
    <div class="acts"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary">Save</button></div></form>`,{wide:true});
  p.querySelector('[data-x]').onclick=()=>closePop();
  p.querySelector('#thF').onsubmit=e=>{ e.preventDefault(); t.name=p.querySelector('#thN').value.trim()||t.name; t.owner=p.querySelector('#thO').value; t.freq=+p.querySelector('#thF1').value||t.freq; t.period=p.querySelector('#thP').value; t.audience=[...p.querySelectorAll('[data-aud]:checked')].map(x=>+x.dataset.aud); closePop(); render(); toast('Theme saved · hover its name for owner, frequency and audience') };
}

/* ---------- task panel ---------- */
function openTask(rk){
  const it=itemOf(rk), video=S.view==='video', map=video?VSTAGE:STAGE;
  const cols=sheet().cols.filter(c=>c.kind&&it.v?.[c.key]);
  closePop(false);
  $('#drawerLayer').innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dwT"><header><h2 id="dwT">${esc(it.name)}</h2><button class="ib" data-close aria-label="Close task">×</button></header>
    <div class="body"><dl style="margin:0">
      <div class="kv"><dt>Status</dt><dd>${stagePill(map,it.status,false)} <span class="mut">${REAL[it.status]}</span></dd></div>
      ${video?'':`<div class="kv"><dt>Type</dt><dd>${it.type?`<span class="ty" style="background:${TYPE[it.type]}">${it.type}</span>`:'<span class="mut">No type</span>'}</dd></div>`}
      <div class="kv"><dt>${video?'Editor':'Assignee'}</dt><dd>${person(video?it.editor:it.assignee)}</dd></div>
      <div class="kv"><dt>Owner</dt><dd>${person(video?S.video.video.owner:it.owner)}</dd></div>
      ${video?`<div class="kv"><dt>File</dt><dd class="mono ell">${esc(it.file||'')}</dd></div>`:`<div class="kv"><dt>Due</dt><dd>${it.due?short(it.due):'<span class="mut">No date</span>'}</dd></div>
      <div class="kv"><dt>Links</dt><dd>${['doc','design','post','published'].filter(k=>it[k]).map(k=>`<span class="lnk">${esc(site(it[k]))}</span>`).join(' · ')||'<span class="mut">None yet</span>'}</dd></div>`}
      ${cols.map(c=>`<div class="kv"><dt>${esc(nameOf(c))}</dt><dd>${customHtml(c,it.v[c.key])}</dd></div>`).join('')}
    </dl><p class="mut" style="margin:10px 0 0">The task panel is the board's own. Custom columns show here only in this mock; spec 010 keeps them in the sheet.</p></div>
    <form class="cmt" id="cmF"><input class="in" id="cm" placeholder="Write a comment… use @ to mention" aria-label="Comment"><button class="btn primary">Send</button></form></aside>`;
  const dw=$('#drawerLayer');
  dw.querySelector('[data-close]').focus();
  dw.querySelector('[data-close]').onclick=closeTask;
  dw.querySelector('#cmF').onsubmit=e=>{ e.preventDefault(); const v=dw.querySelector('#cm').value.trim(); if(v){ dw.querySelector('#cm').value=''; toast('Comment posted') } };
  S.drawer=rk;
}
function closeTask(){ $('#drawerLayer').innerHTML=''; S.drawer=null; render() }

/* ---------- paste ---------- */
function paste(){
  const video=S.view==='video';
  $('#layer').innerHTML=`<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ppT"><h2 id="ppT">${video?'Paste clips':'Paste plan'}</h2><p>Copy rows from your Google Sheet, including the heading row, and paste them here.</p>
    <textarea id="ppIn" aria-label="Paste here" placeholder="Click here and press Ctrl+V (⌘V)">${video?'File name\tTitle\tHook\tMusic cleared\n15_IMG_0294_0m09.9s-1m23.7s.mp4\t300 Numbers. Where’s the Insight?\tData is not insight\tyes':'Theme\tPillar\tTitle\tType\tStatus\tHook\tPlatform\tWords\tNotes\nStrategy\tAI\tAI Pillar SM Campaign - Post 3\tPost\tPlanned\tAI needs an owner\tLinkedIn\t160\tcheck with Yosra'}</textarea>
    <button class="btn" id="ppGo" style="justify-self:start">Read the rows</button><div id="ppOut"></div></div></div>`;
  $('#ppIn').focus();
  $('#ppGo').onclick=()=>{
    $('#ppOut').innerHTML=video?`<table class="ptab"><thead><tr><th>Pasted heading</th><th>Fills</th><th></th></tr></thead><tbody><tr><td>File name</td><td>File name</td><td><span class="chip ok">1</span></td></tr><tr><td>Hook</td><td>Hook · Text</td><td><span class="chip ok">1</span></td></tr><tr><td>Music cleared</td><td>Music cleared · Checkbox</td><td><span class="chip ok">1</span></td></tr></tbody></table><div class="acts"><button class="btn" data-x>Close</button><button class="btn primary" data-addrows>Add 1 clip</button></div>`
    :`<table class="ptab"><thead><tr><th>Pasted heading</th><th>Fills</th><th></th></tr></thead><tbody>
      <tr><td>Status</td><td>${esc(nameOf(col('status')))}</td><td><span class="chip ok">1 value</span></td></tr>
      ${['Hook','Platform','Words'].map(n=>{ const c=S.content.cols.find(x=>nameOf(x).toLowerCase()===n.toLowerCase()); return `<tr><td>${n}</td><td>${c?`${esc(nameOf(c))} · ${KINDS.find(k=>k[0]===c.kind)[2]}`:'<span class="mut">No such column</span>'}</td><td>${c?'<span class="chip ok">1 value</span>':'<span class="chip bad">not imported</span>'}</td></tr>` }).join('')}
    </tbody></table>
    <div><div class="ph" style="padding-inline:0">Not imported</div><div class="panel-row" style="padding-inline:0"><span class="grow">Notes <span class="mut">· 1 value</span></span><button class="btn" id="addNotes">Add as a column</button></div></div>
    <div class="acts"><button class="btn" data-x>Close</button><button class="btn primary" data-addrows>Add 1 piece</button></div>`;
    $('#ppOut').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{$('#layer').innerHTML=''});
    $('#addNotes')?.addEventListener('click',e=>{ if(!S.content.cols.some(c=>nameOf(c)==='Notes')) S.content.cols.push({key:'c:notes',name:'Notes',kind:'text',w:160,who:['you',0]}); e.target.outerHTML='<span class="chip ok">“Notes” added as a Text column</span>'; render() });
    $('[data-addrows]').onclick=()=>{
      if(video) S.video.clips.push({id:'v'+(uid++),no:'15',name:'300 Numbers. Where’s the Insight?',status:'todo',editor:null,source:'IMG_0294',file:'15_IMG_0294_0m09.9s-1m23.7s.mp4',len:'1:13.8',published:'',v:{'c:hook':'Data is not insight','c:music':'1'}});
      else { const id='p'+(uid++), v={}; const set=(n,val)=>{ const c=S.content.cols.find(x=>nameOf(x).toLowerCase()===n); if(c) v[c.key]=val }; set('hook','AI needs an owner'); set('platform','li'); set('words','160'); set('notes','check with Yosra');
        S.content.pieces.push({id,theme:'t1',pillar:'pl1',name:'AI Pillar SM Campaign - Post 3',type:'Post',status:'todo',assignee:null,owner:'samaa',doc:'',design:'',post:'',published:'',v}) }
      $('#layer').innerHTML=''; render(); toast(video?'1 clip added':'1 piece added, with its custom values') };
  };
}

/* ---------- events ---------- */
const grid=$('#grid');
grid.addEventListener('click',e=>{
  const m=e.target.closest('[data-col-menu]'); if(m){ colMenu(m.dataset.colMenu,m); return }
  const tg=e.target.closest('[data-toggle]'); if(tg){ e.stopPropagation(); const t=themeOf(tg.dataset.toggle); t.collapsed=!t.collapsed; render(); return }
  if(e.target.closest('[data-vtoggle]')){ S.video.video.collapsed=!S.video.video.collapsed; render(); return }
  const tm=e.target.closest('[data-theme-menu]'); if(tm){ themeMenu(tm.dataset.themeMenu,tm); return }
  const pm=e.target.closest('[data-pillar-menu]'); if(pm){ const [t,p]=pm.dataset.pillarMenu.split('|'); pillarMenu(t,p,pm); return }
  const op=e.target.closest('[data-open]'); if(op){ openTask(op.dataset.open); return }
  const cell=e.target.closest('[data-cell]'); if(!cell||cell.querySelector('input')) return;
  const id=cell.dataset.cell, [rk,key]=id.split('|'), c=col(key);
  const again=S.active===id&&!S.editing;
  S.active=id; if(S.editing&&S.editing!==id){ S.editing=null } if(!again) render();
  const el=document.querySelector(`[data-cell="${CSS.escape(id)}"]`);
  const textual=key==='title'||key==='date'||key==='source'||key==='fileName'||(c?.kind&&['text','number','date'].includes(c.kind));
  if(!textual&&!(rk.startsWith('t:')&&key==='title')&&!(rk.startsWith('p:')&&key==='title')) act(id,el||cell);
});
grid.addEventListener('dblclick',e=>{
  const rzh=e.target.closest('[data-rz]'); if(rzh){ fit(rzh.dataset.rz); return }
  const cell=e.target.closest('[data-cell]'); if(cell&&!cell.querySelector('input')) act(cell.dataset.cell,cell);
});
grid.addEventListener('keydown',e=>{
  if(e.target.id==='draftIn'){
    if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(v){ if(S.view==='video') S.video.clips.push({id:'v'+(uid++),no:'',name:v,status:'todo',editor:null,source:'',file:'',len:'',published:'',v:{}}); else { const t=themeOf(S.draft.theme); S.content.pieces.push({id:'p'+(uid++),theme:t.id,pillar:null,name:v,type:'Post',status:'todo',owner:t.owner,assignee:t.owner===S.me||isAdmin()?null:S.me,doc:'',design:'',post:'',published:'',v:{}}) } toast(`Added “${v}”${S.view==='content'?` · owned by ${PEOPLE[themeOf(S.draft.theme).owner][0]}`:''}`) } S.draft=null; render() }
    if(e.key==='Escape'){ S.draft=null; render() } return }
  const inp=e.target.closest('input.cell-in');
  if(inp){ if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); const id=S.editing; const ok=commit(id,inp.value); if(!ok) return; S.editing=null; S.active=id; render(); if(e.key==='Tab') nav(e.shiftKey?'ArrowLeft':'ArrowRight') } if(e.key==='Escape'){ e.preventDefault(); S.editing=null; render() } return }
  const cell=e.target.closest('[data-cell]'); if(!cell) return;
  const id=cell.dataset.cell, [rk,key]=id.split('|'), c=col(key);
  if(e.altKey&&e.key==='ArrowDown'&&c){ e.preventDefault(); colMenu(key,document.querySelector(`[data-col-menu="${key}"]`)); return }
  if(e.key==='Enter'||e.key==='F2'||(e.key===' '&&c?.kind==='checkbox')){ e.preventDefault(); act(id,cell); return }
  if(e.key===' '&&rk.startsWith('t:')){ e.preventDefault(); const t=themeOf(rk.slice(2)); t.collapsed=!t.collapsed; render(); return }
  if((e.key==='Delete'||e.key==='Backspace')&&c?.kind){ const it=itemOf(rk); if(it&&canEdit(it)){ delete it.v?.[key]; render() } return }
  const textual=key==='title'||key==='date'||key==='source'||key==='fileName'||(c?.kind&&['text','number','date'].includes(c.kind));
  if(textual&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[kc]:/.test(rk)){ const it=itemOf(rk); if(canEdit(it)&&!it.archived&&!it.dropped){ e.preventDefault(); editStart(id,e.key) } return }
  if(e.key.startsWith('Arrow')||e.key==='Tab'){ e.preventDefault(); nav(e.key==='Tab'?(e.shiftKey?'ArrowLeft':'ArrowRight'):e.key) }
});
function nav(dir){
  const rows=rowsNow(), cols=['rowNo',...visible().map(c=>c.key)];
  let [rk,key]=(S.active||`${rows[0].key}|title`).split('|'), ri=rows.findIndex(r=>r.key===rk), ci=cols.indexOf(key);
  const rtl=getComputedStyle(document.documentElement).direction==='rtl';
  if(dir==='ArrowRight') ci+=rtl?-1:1; else if(dir==='ArrowLeft') ci+=rtl?1:-1; else if(dir==='ArrowDown') ri++; else if(dir==='ArrowUp') ri--;
  ri=Math.max(0,Math.min(rows.length-1,ri)); ci=Math.max(0,Math.min(cols.length-1,ci));
  if(spans(rows[ri])) ci=Math.min(ci,1);
  S.active=`${rows[ri].key}|${cols[ci]}`; render();
}
grid.addEventListener('focusout',e=>{ const inp=e.target.closest?.('input.cell-in'); if(inp&&S.editing&&inp.id==='in'){ const id=S.editing; setTimeout(()=>{ if(S.editing===id&&document.activeElement!==inp){ commit(id,inp.value); S.editing=null; render() } },0) } });
/* drag to reorder */
grid.addEventListener('dragstart',e=>{ const th=e.target.closest('.th[draggable]'); if(!th) return; drag=th.dataset.col; th.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',drag) });
grid.addEventListener('dragover',e=>{ const th=e.target.closest('.th'); if(!drag||!th||th.classList.contains('ti')||th.classList.contains('no')) return; e.preventDefault(); grid.querySelectorAll('.drop-before').forEach(x=>x.classList.remove('drop-before')); th.classList.add('drop-before') });
grid.addEventListener('drop',e=>{ const th=e.target.closest('.th'); if(!drag||!th) return; e.preventDefault(); if(th.dataset.col!==drag){ moveBefore(drag,th.dataset.col); toast(`Moved ${labelOf(col(drag))}`) } drag=null; render() });
grid.addEventListener('dragend',()=>{ drag=null; render() });
/* resize */
grid.addEventListener('pointerdown',e=>{ const h=e.target.closest('[data-rz]'); if(!h) return; e.preventDefault(); const c=col(h.dataset.rz); rz={c,x:e.clientX,w:c.w,rtl:getComputedStyle(document.documentElement).direction==='rtl'}; h.classList.add('on'); h.setPointerCapture(e.pointerId) });
grid.addEventListener('pointermove',e=>{ if(!rz) return; const d=(e.clientX-rz.x)*(rz.rtl?-1:1); rz.c.w=Math.max(60,Math.min(600,Math.round(rz.w+d))); grid.style.gridTemplateColumns=`40px ${visible().map(c=>c.w+'px').join(' ')}` });
grid.addEventListener('pointerup',()=>{ if(!rz) return; stamp(rz.c); rz=null; render() });
function fit(key){ const c=col(key), ix=visible().indexOf(c)+2; let w=60; grid.querySelectorAll(`.row > .c:nth-child(${ix})`).forEach(el=>{ const inner=el.firstElementChild; w=Math.max(w,(inner?inner.scrollWidth:0)+28) }); c.w=Math.min(600,w); stamp(c); render(); toast(`Fitted ${labelOf(c)} to ${c.w}px`) }

/* toolbar */
$('#colsBtn').onclick=()=>$('#colsBtn').getAttribute('aria-expanded')==='true'?closePop():panel();
$('#addBtn').onclick=e=>editor(null,e.currentTarget);
$('#pasteBtn').onclick=paste;
$('#mineBtn').onclick=e=>{ S.mine=!S.mine; e.currentTarget.setAttribute('aria-pressed',String(S.mine)); render(); toast(S.mine?`Showing ${PEOPLE[S.me][0]}'s rows`:'Showing everyone') };
$('#archBtn').onclick=e=>{ S.showArch=!S.showArch; e.currentTarget.setAttribute('aria-pressed',String(S.showArch)); render() };
$('#themeBtn').onclick=e=>{ if(!isAdmin()){ toast('Only admins and superusers add themes'); return } namePrompt(e.currentTarget,'New theme name','',v=>{ S.content.themes.push({id:'t'+(uid++),name:v,owner:S.me,freq:1,period:'week',audience:[],pillars:[],collapsed:false}); render(); toast(`Theme “${v}” added`) }) };
$('#viewer').onchange=e=>{ S.me=e.target.value; S.active=null; render(); toast(`Viewing as ${PEOPLE[S.me][0]}${isAdmin()?' · admin, can edit every row':' · edits only rows they own or are assigned'}`) };
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ S.view=b.dataset.view; S.active=null; S.editing=null; S.draft=null; document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); closePop(false); render() });
$('[data-goto]').onclick=()=>document.querySelector('[data-view="content"]').click();
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ S.set=b.dataset.set; document.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render() });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if($('#layer').innerHTML){ e.preventDefault(); if($('.scrim')) $('#layer').innerHTML=''; else closePop() } else if(S.drawer){ e.preventDefault(); closeTask() } });
document.addEventListener('mousedown',e=>{ const pop=$('#layer .pop'); if(pop&&!pop.contains(e.target)&&!anchorEl?.contains(e.target)&&!e.target.closest('.toast')) closePop(false) });
render();
</script>
