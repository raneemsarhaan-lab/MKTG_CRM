document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n        <div style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #8A8D91; margin-bottom: 14px;\">Weekly capacity<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px;\">\n          <input type=\"number\" min=\"1\" value=\"{{ capacityHours }}\" sc-camel-on-change=\"{{ onCapacityHoursChange }}\" style=\"font-size: 14px; font-weight: 700; padding: 10px 12px; border-radius: 8px; border: 1px solid #E1E1E0; background: #F6F6F4; width: 90px; color: #1B1A13;\">\n          <span style=\"font-size: 13px; color: #8A8D91;\">hours per person / week<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-radius: 16px; padding: 22px; background: #fff; border: 1px solid #E1E1E0; box-shadow: 0 1px 3px rgba(16,16,11,.05);\">\n        <div style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #8A8D91; margin-bottom: 4px;\">SLA matrix<\u002Fdiv>\n        <p style=\"font-size: 11.5px; color: #8A8D91; margin: 0 0 14px 0;\">Target business days per stage × type.<\u002Fp>\n        <div style=\"overflow-x: auto;\">\n          <sc-raw-table style=\"border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: 100%;\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th style=\"text-align: left; font-weight: 700; padding: 6px 8px; color: #8A8D91; position: sticky; left: 0; background: #fff;\">Stage<\u002Fsc-raw-th>\n                <sc-for list=\"{{ contentTypes }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <sc-raw-th style=\"font-weight: 700; padding: 6px 6px; color: #8A8D91; min-width: 60px;\">{{ c.label }}<\u002Fsc-raw-th>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ slaRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"padding: 6px 8px; white-space: nowrap; position: sticky; left: 0; background: #fff;\">\n                    <span style=\"display: inline-flex; align-items: center; gap: 8px;\"><span style=\"{{ row.dotStyle }}\"><\u002Fspan>{{ row.label }}<\u002Fspan>\n                  <\u002Fsc-raw-td>\n                  <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"4\">\n                    <sc-raw-td style=\"padding: 4px 4px;\">\n                      <input type=\"number\" min=\"0\" value=\"{{ cell.value }}\" sc-camel-on-change=\"{{ cell.onChange }}\" style=\"width: 48px; text-align: center; font-size: 12.5px; padding: 6px 4px; border-radius: 6px; border: 1px solid #E1E1E0; background: #F6F6F4; color: #1B1A13;\">\n                    <\u002Fsc-raw-td>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ brandModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeAddBrand }}\" style=\"position: fixed; inset: 0; z-index: 65; background: rgba(16,16,11,.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px;\">\n      <div sc-camel-on-click=\"{{ stopPropagation }}\" style=\"width: 100%; max-width: 460px; background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 30px 80px rgba(16,16,11,.35); max-height: 90vh; overflow-y: auto;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n          <h2 style=\"font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 18px; color: #1B1A13; margin: 0;\">Add brand<\u002Fh2>\n          <button sc-camel-on-click=\"{{ closeAddBrand }}\" style=\"width: 30px; height: 30px; border-radius: 999px; border: none; background: #F1F1EF; cursor: pointer; color: #8A8D91;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 16px;\">\n          <div style=\"{{ brandDraftLogoBoxStyle }}\">{{ brandDraftLogoNode }}<\u002Fdiv>\n          <div>\n            <label style=\"font-size: 12.5px; font-weight: 600; color: #8A8D91; display: block; margin-bottom: 6px;\">Logo<\u002Flabel>\n            <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onBrandLogoFile }}\" style=\"font-size: 12.5px;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <label style=\"display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #1B1A13;\">Brand name<\u002Flabel>\n        <input value=\"{{ brandDraftName }}\" sc-camel-on-change=\"{{ onBrandNameChange }}\" placeholder=\"e.g. Forefront Consulting\" style=\"width: 100%; font-size: 14px; padding: 11px 13px; border-radius: 12px; border: 1px solid #E1E1E0; background: #F6F6F4; color: #1B1A13; margin-bottom: 14px; box-sizing: border-box;\">\n\n        <label style=\"display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #1B1A13;\">Color<\u002Flabel>\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 14px;\">\n          <input type=\"color\" value=\"{{ brandDraftColor }}\" sc-camel-on-change=\"{{ onBrandColorChange }}\" style=\"width: 32px; height: 32px; border-radius: 8px; border: 1px solid #E1E1E0; padding: 2px; cursor: pointer;\">\n          <span style=\"font-size: 12.5px; color: #8A8D91;\">{{ brandDraftColor }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <label style=\"display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #1B1A13;\">Description<\u002Flabel>\n        <textarea value=\"{{ brandDraftDescription }}\" sc-camel-on-change=\"{{ onBrandDescriptionChange }}\" placeholder=\"What this brand is, tone, audience…\" rows=\"3\" style=\"width: 100%; font-size: 14px; padding: 11px 13px; border-radius: 12px; border: 1px solid #E1E1E0; background: #F6F6F4; color: #1B1A13; margin-bottom: 14px; box-sizing: border-box; resize: vertical; font-family: 'Inter', sans-serif;\"><\u002Ftextarea>\n\n        <label style=\"display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #1B1A13;\">Brand guidelines<\u002Flabel>\n        <input type=\"file\" multiple=\"\" sc-camel-on-change=\"{{ onBrandFileAdd }}\" style=\"font-size: 12.5px; margin-bottom: 6px;\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;\">\n          <sc-for list=\"{{ brandGuidelineFiles }}\" as=\"f\" hint-placeholder-count=\"0\">\n            <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 8px; border-radius: 8px; background: #F1F1EF; color: #1B1A13;\">{{ f.name }}<button sc-camel-on-click=\"{{ f.onRemove }}\" style=\"border: none; background: transparent; color: #C7CFE0; cursor: pointer;\">✕<\u002Fbutton><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <label style=\"display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #1B1A13;\">Communication guidelines<\u002Flabel>\n        <input type=\"file\" multiple=\"\" sc-camel-on-change=\"{{ onCommsFileAdd }}\" style=\"font-size: 12.5px; margin-bottom: 6px;\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;\">\n          <sc-for list=\"{{ commsGuidelineFiles }}\" as=\"f\" hint-placeholder-count=\"0\">\n            <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 8px; border-radius: 8px; background: #F1F1EF; color: #1B1A13;\">{{ f.name }}<button sc-camel-on-click=\"{{ f.onRemove }}\" style=\"border: none; background: transparent; color: #C7CFE0; cursor: pointer;\">✕<\u002Fbutton><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ submitAddBrand }}\" disabled=\"{{ addBrandSubmitDisabled }}\" style=\"{{ brandSubmitBtnStyle }}\">Add brand<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ typeModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeAddType }}\" style=\"position: fixed; inset: 0; z-index: 65; background: rgba(16,16,11,.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px;\">\n      <div sc-camel-on-click=\"{{ stopPropagation }}\" style=\"width: 100%; max-width: 420px; background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 30px 80px rgba(16,16,11,.35); max-height: 90vh; overflow-y: auto;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n          <h2 style=\"font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 18px; color: #1B1A13; margin: 0;\">Add task / content type<\u002Fh2>\n          <button sc-camel-on-click=\"{{ closeAddType }}\" style=\"width: 30px; height: 30px; border-radius: 999px; border: none; background: #F1F1EF; cursor: pointer; color: #8A8D91;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <label style=\"display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #1B1A13;\">Type name<\u002Flabel>\n        <input value=\"{{ typeDraftName }}\" sc-camel-on-change=\"{{ onTypeNameChange }}\" placeholder=\"e.g. Podcast\" style=\"width: 100%; font-size: 14px; padding: 11px 13px; border-radius: 12px; border: 1px solid #E1E1E0; background: #F6F6F4; color: #1B1A13; margin-bottom: 16px; box-sizing: border-box;\">\n\n        <label style=\"display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #1B1A13;\">SLA (business days per stage)<\u002Flabel>\n        <div style=\"border-radius: 12px; overflow: hidden; border: 1px solid #E1E1E0;\">\n          <sc-for list=\"{{ typeSlaRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"{{ row.rowStyle }}\">\n              <span style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: #1B1A13;\"><span style=\"{{ row.dotStyle }}\"><\u002Fspan>{{ row.label }}<\u002Fspan>\n              <input type=\"number\" min=\"0\" value=\"{{ row.value }}\" sc-camel-on-change=\"{{ row.onChange }}\" style=\"width: 48px; text-align: center; font-size: 12.5px; padding: 4px; border-radius: 6px; border: 1px solid #E1E1E0;\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ submitAddType }}\" disabled=\"{{ addTypeSubmitDisabled }}\" style=\"{{ typeSubmitBtnStyle }}\">Add type<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst STAGE_META = {\n  'todo': { en: 'To Do', color: '#64748B' },\n  'c-prog': { en: 'C-In Progress', color: '#3B82F6' },\n  'c-final': { en: 'C-Review', color: '#2E6FB0' },\n  'c-check': { en: 'C-Check', color: '#1F5A94' },\n  'r-design': { en: 'Ready For Design', color: '#8B5CF6' },\n  'd-prog': { en: 'D-In Progress', color: '#7C3AED' },\n  'd-check': { en: 'D-Check', color: '#5B3FB5' },\n  'final-check': { en: 'F-Check', color: '#F59E0B' },\n};\nconst STAGES = Object.keys(STAGE_META);\nconst REVIEW_STAGES = ['c-final', 'c-check', 'd-check', 'final-check'];\nconst BRAND_PALETTE = ['#B4322F', '#0E7C7B', '#7A5A2E', '#1E293B', '#D4537E', '#378ADD', '#EF9F27', '#534AB7'];\n\nfunction initials(name) {\n  return name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();\n}\nfunction avatarColor(name) {\n  const palette = ['#1B1D1F', '#6E5BE6', '#3FA34D', '#5B93F5', '#E0736A', '#5B6066', '#B4863F'];\n  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;\n  return palette[Math.abs(h) % palette.length];\n}\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'team',\n    members: [\n      { name: 'Islam', role: 'Managing Director', access: 'Admin', capacity: 40 },\n      { name: 'Rania', role: 'Marketing Manager', access: 'Super User', capacity: 40 },\n      { name: 'Youssef', role: 'Brand Director', access: 'Super User', capacity: 35 },\n      { name: 'Nour', role: 'Content Creator', access: 'User', capacity: 40 },\n      { name: 'Karim', role: 'Graphic Designer', access: 'User', capacity: 40 },\n    ],\n    currentUser: 'Islam',\n    stageOwnerMap: { 'c-final': 'Marketing Manager', 'c-check': 'Managing Director', 'd-check': 'Brand Director', 'final-check': 'Marketing Manager' },\n    draft: { name: '', role: '', access: 'User' },\n    brands: [\n      { name: 'Forefront Consulting', color: '#B4322F' },\n      { name: 'Omnisight', color: '#0E7C7B' },\n      { name: 'The Strategy Community', color: '#7A5A2E' },\n      { name: 'Islam Personal Branding', color: '#1E293B' },\n    ],\n    brandModalOpen: false,\n    brandDraft: { name: '', color: BRAND_PALETTE[2], logo: null, description: '', brandFiles: [], commsFiles: [] },\n    contentTypes: ['Post', 'Reel', 'Carousel', 'Story', 'Other'],\n    typeModalOpen: false,\n    typeDraft: { name: '', sla: {} },\n    capacityHours: 40,\n    slaMatrix: {\n      'todo': {}, 'c-prog': { Post: 2, Reel: 3, Carousel: 3, Story: 1, Other: 2 },\n      'c-final': { Post: 1, Reel: 1, Carousel: 1, Story: 1, Other: 1 },\n      'c-check': { Post: 1, Reel: 1, Carousel: 1, Story: 1, Other: 1 },\n      'r-design': {}, 'd-prog': { Post: 2, Reel: 3, Carousel: 4, Story: 1, Other: 2 },\n      'd-check': { Post: 1, Reel: 1, Carousel: 1, Story: 1, Other: 1 },\n      'final-check': { Post: 1, Reel: 1, Carousel: 1, Story: 1, Other: 1 },\n    },\n  };\n\n  updateMember(name, patch) {\n    this.setState(s => ({ members: s.members.map(m => m.name === name ? { ...m, ...patch } : m) }));\n  }\n  removeMember(name) {\n    this.setState(s => ({ members: s.members.filter(m => m.name !== name) }));\n  }\n  setStageOwner(stage, role) {\n    this.setState(s => ({ stageOwnerMap: { ...s.stageOwnerMap, [stage]: role } }));\n  }\n  addMember() {\n    const d = this.state.draft;\n    if (!d.name.trim()) return;\n    this.setState(s => ({ members: [...s.members, { name: d.name.trim(), role: d.role.trim() || 'Team member', access: d.access, capacity: 40 }], draft: { name: '', role: '', access: 'User' } }));\n  }\n  removeBrand(name) {\n    this.setState(s => ({ brands: s.brands.filter(b => b.name !== name) }));\n  }\n  openAddBrand() {\n    this.setState({ brandModalOpen: true, brandDraft: { name: '', color: BRAND_PALETTE[Math.floor(Math.random() * BRAND_PALETTE.length)], logo: null, description: '', brandFiles: [], commsFiles: [] } });\n  }\n  closeAddBrand() { this.setState({ brandModalOpen: false }); }\n  updateBrandDraft(patch) { this.setState(s => ({ brandDraft: { ...s.brandDraft, ...patch } })); }\n  onBrandLogoFile(e) {\n    const f = e.target.files[0]; if (!f) return;\n    const r = new FileReader();\n    r.onload = () => this.updateBrandDraft({ logo: r.result });\n    r.readAsDataURL(f);\n  }\n  addBrandFiles(list, names) { this.updateBrandDraft({ [list]: [...this.state.brandDraft[list], ...names] }); }\n  removeBrandFile(list, idx) { this.updateBrandDraft({ [list]: this.state.brandDraft[list].filter((_, i) => i !== idx) }); }\n  submitAddBrand() {\n    const d = this.state.brandDraft;\n    if (!d.name.trim()) return;\n    this.setState(s => ({\n      brands: [...s.brands, { name: d.name.trim(), color: d.color, logo: d.logo, description: d.description, brandFiles: d.brandFiles, commsFiles: d.commsFiles }],\n      brandModalOpen: false,\n    }));\n  }\n  openAddType() {\n    this.setState(s => {\n      const sla = {}; for (const st of STAGES) if (st !== 'publish') sla[st] = (s.slaMatrix[st] && s.slaMatrix[st].Other != null) ? s.slaMatrix[st].Other : 1;\n      return { typeModalOpen: true, typeDraft: { name: '', sla } };\n    });\n  }\n  closeAddType() { this.setState({ typeModalOpen: false }); }\n  updateTypeDraftName(name) { this.setState(s => ({ typeDraft: { ...s.typeDraft, name } })); }\n  updateTypeDraftSla(stage, val) {\n    const n = Math.max(0, Number(val) || 0);\n    this.setState(s => ({ typeDraft: { ...s.typeDraft, sla: { ...s.typeDraft.sla, [stage]: n } } }));\n  }\n  submitAddType() {\n    const d = this.state.typeDraft;\n    const t = d.name.trim();\n    if (!t) return;\n    this.setState(s => {\n      const slaMatrix = {};\n      for (const st of STAGES) slaMatrix[st] = { ...s.slaMatrix[st], [t]: d.sla[st] != null ? d.sla[st] : 1 };\n      return { contentTypes: [...s.contentTypes, t], slaMatrix, typeModalOpen: false };\n    });\n  }\n  removeContentType(t) {\n    this.setState(s => ({ contentTypes: s.contentTypes.filter(c => c !== t) }));\n  }\n  updateSLA(stage, type, val) {\n    const n = Math.max(0, Number(val) || 0);\n    this.setState(s => ({ slaMatrix: { ...s.slaMatrix, [stage]: { ...s.slaMatrix[stage], [type]: n } } }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isTeamTab = s.tab === 'team';\n    const tabBase = { fontSize: 12.5, fontWeight: 700, padding: '9px 16px', borderRadius: 7, border: 'none', cursor: 'pointer', fontFamily: 'Inter, sans-serif' };\n    const teamTabStyle = { ...tabBase, background: isTeamTab ? '#fff' : 'transparent', color: isTeamTab ? '#1B1A13' : '#8A8D91', boxShadow: isTeamTab ? '0 1px 3px rgba(16,16,11,.12)' : 'none' };\n    const workflowTabStyle = { ...tabBase, background: !isTeamTab ? '#fff' : 'transparent', color: !isTeamTab ? '#1B1A13' : '#8A8D91', boxShadow: !isTeamTab ? '0 1px 3px rgba(16,16,11,.12)' : 'none' };\n\n    const members = s.members.map((m, i) => ({\n      name: m.name, role: m.role, capacity: m.capacity, access: m.access,\n      isYou: m.name === s.currentUser,\n      initials: initials(m.name),\n      rowStyle: { padding: '16px 20px', borderTop: i === 0 ? 'none' : '1px solid #F1F1EF' },\n      avatarStyle: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%', fontSize: 11, fontWeight: 700, color: '#fff', width: 34, height: 34, flexShrink: 0, background: avatarColor(m.name), fontFamily: 'Inter, sans-serif' },\n      onRoleChange: e => this.updateMember(m.name, { role: e.target.value }),\n      onCapacityChange: e => this.updateMember(m.name, { capacity: Math.max(0, Number(e.target.value) || 0) }),\n      onAccessChange: e => this.updateMember(m.name, { access: e.target.value }),\n      accessOptions: ['Admin', 'Super User', 'User'].map(a => ({ value: a, selected: a === m.access })),\n      onRemove: () => this.removeMember(m.name),\n      removeTitle: m.name === s.currentUser ? \"You can't remove yourself\" : 'Remove',\n      removeBtnStyle: { border: 'none', background: 'transparent', cursor: m.name === s.currentUser ? 'default' : 'pointer', color: '#B9821A', fontSize: 13, padding: 6, borderRadius: 8, opacity: m.name === s.currentUser ? 0.25 : 1 },\n      stageChips: REVIEW_STAGES.map(stage => {\n        const owns = s.stageOwnerMap[stage] === m.role;\n        return {\n          label: STAGE_META[stage].en,\n          title: owns ? `Owns ${STAGE_META[stage].en} — click to unassign` : `Assign ${STAGE_META[stage].en} to ${m.name}`,\n          onClick: () => this.setStageOwner(stage, owns ? '' : m.role),\n          style: { display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11.5, fontWeight: 600, padding: '5px 10px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: 'Inter, sans-serif', background: owns ? STAGE_META[stage].color : '#F1F1EF', color: owns ? '#fff' : '#8A8D91' },\n          dotStyle: { width: 6, height: 6, borderRadius: 2, background: owns ? 'rgba(255,255,255,.85)' : STAGE_META[stage].color },\n        };\n      }),\n    }));\n\n    const addDisabled = !s.draft.name.trim();\n    const addBtnBase = { display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 700, color: '#fff', padding: '10px 16px', borderRadius: 8, border: 'none', cursor: 'pointer', fontFamily: 'Inter, sans-serif' };\n\n    const brands = s.brands.map(b => ({\n      name: b.name,\n      avatarNode: b.logo\n        ? React.createElement('img', { src: b.logo, alt: '', style: { width: 16, height: 16, borderRadius: 4, objectFit: 'cover', display: 'inline-block' } })\n        : React.createElement('span', { style: { width: 16, height: 16, borderRadius: 4, background: b.color, display: 'inline-block' } }),\n      onRemove: () => this.removeBrand(b.name),\n    }));\n\n    const contentTypes = s.contentTypes.map(c => ({\n      label: c,\n      onRemove: () => this.removeContentType(c),\n      removeDisabled: s.contentTypes.length <= 1,\n      removeOpacity: s.contentTypes.length <= 1 ? 0.3 : 1,\n    }));\n\n    const bd = s.brandDraft;\n    const addBrandSubmitDisabled = !bd.name.trim();\n    const td = s.typeDraft;\n    const addTypeSubmitDisabled = !td.name.trim();\n    const typeSlaRows = STAGES.filter(st => st !== 'publish').map((stage, i) => ({\n      label: STAGE_META[stage].en,\n      dotStyle: { width: 7, height: 7, borderRadius: 2, background: STAGE_META[stage].color, display: 'inline-block' },\n      value: td.sla[stage] != null ? td.sla[stage] : 0,\n      onChange: e => this.updateTypeDraftSla(stage, e.target.value),\n      rowStyle: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 12px', borderTop: i === 0 ? 'none' : '1px solid #E1E1E0', background: i % 2 ? '#FAFAF8' : '#fff' },\n    }));\n\n    const slaRows = STAGES.filter(st => st !== 'todo' && st !== 'r-design').map(stage => ({\n      label: STAGE_META[stage].en,\n      dotStyle: { width: 7, height: 7, borderRadius: 2, background: STAGE_META[stage].color, display: 'inline-block' },\n      cells: s.contentTypes.map(type => ({\n        value: (s.slaMatrix[stage] && s.slaMatrix[stage][type] != null) ? s.slaMatrix[stage][type] : 0,\n        onChange: e => this.updateSLA(stage, type, e.target.value),\n      })),\n    }));\n\n    return {\n      isTeamTab, isWorkflowTab: !isTeamTab,\n
