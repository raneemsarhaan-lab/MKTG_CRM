<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attachments lab</title>
<link rel="stylesheet" href="att.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F1F3F8; font-family: Inter, system-ui, sans-serif; color: #18233F; }
  #scroller { height: 100vh; overflow: auto; }
  #panel { max-width: 900px; margin: 16px auto; padding: 18px 22px 40px; background: #fff; border-radius: 16px; }
  @media (max-width: 640px) { #panel { margin: 0; border-radius: 0; padding: 14px 16px 40px; } }
  .field { height: 140px; border-radius: 12px; background: #F8FAFD; color: #929CB0; padding: 12px; font-size: 12px; }
  #comments { margin-top: 24px; border-top: 1px solid #E9EDF4; padding-top: 14px; }
  #comments textarea { width: 100%; min-height: 56px; border: 1px solid #E9EDF4; border-radius: 10px; padding: 10px; font: inherit; }
  .cmt { margin: 8px 0; padding: 8px 10px; background: #F8FAFD; border-radius: 10px; white-space: pre-wrap; font-size: 14px; }
</style>
</head>
<body>
<div id="scroller">
  <div id="panel">
    <div id="header"></div>
    <div class="field">Title · Stage · Brief</div>
    <div class="field" style="height:420px">Fields · Subtasks</div>
    <div id="root"></div>
    <div id="comments"></div>
    <div class="field" style="height:900px">Activity</div>
  </div>
</div>
<div id="message"></div>
<script src="bundle.js"></script>
</body>
</html>
