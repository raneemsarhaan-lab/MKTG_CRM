<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header lab</title>
<link rel="stylesheet" href="header.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #fff; --font-heading: Montserrat, system-ui, sans-serif; --font-body: Inter, system-ui, sans-serif; }
  .lab-board { display: grid; grid-auto-flow: column; grid-auto-columns: 244px; gap: 14px; overflow-x: auto; padding: 14px 26px 16px 38px; }
  .lab-col { background: #F3F3F7; border-radius: 14px; min-height: 420px; padding: 10px; font: 700 12px Montserrat, sans-serif; }
  .lab-week { margin: 0 26px; padding: 20px; border: 1px dashed #ECECF1; border-radius: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="bundle.js"></script>
</body>
</html>
