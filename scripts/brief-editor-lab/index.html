<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief editor lab</title>
<link rel="stylesheet" href="brief.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F1F3F8; font-family: Inter, system-ui, sans-serif; }
  h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
  #scroller { height: 100vh; overflow: auto; }
  #root { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  #outside { height: 60px; margin: 24px auto; max-width: 760px; border: 1px dashed #bbb; display: grid; place-items: center; color: #888; font-size: 12px; }
</style>
</head>
<body>
<div id="scroller"><div id="root"></div><div id="outside">outside the brief</div></div>
<script src="bundle.js"></script>
</body>
</html>
